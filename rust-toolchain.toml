[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# The supervisor ships into each game vendor's runtime base and is linked
# statically against musl so it depends on no host libc (see the header note in
# games/minecraft/Dockerfile). Declared here rather than in the game Dockerfiles
# because `rustup target add` applies to the image's *default* toolchain, which is
# not the one this file selects — the target has to be attached to the pinned
# channel or the build fails with "can't find crate for `core`".
targets = ["x86_64-unknown-linux-musl"]
