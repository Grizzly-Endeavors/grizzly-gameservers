apiVersion: apps/v1
kind: Deployment
metadata:
  name: gary-web
  labels:
    app.kubernetes.io/name: gary-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gary-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gary-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: gary-web
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            # nginx writes its pid and temp files here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
