# TLS terminates at the edge (Caddy's *.grizzly-endeavors.com wildcard), which
# forwards to ingress-nginx; this only routes the host and gates it behind
# basic auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gary-web
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: gary-web-basic-auth
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
    nginx.ingress.kubernetes.io/auth-realm: "Gary"
spec:
  ingressClassName: nginx
  rules:
    - host: gameservers.grizzly-endeavors.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gary-web
                port:
                  number: 80
