# The basic-auth credential the Ingress checks, as an htpasswd line. The
# matching plaintext (username + password, to hand out) sits beside it in the
# same 1Password item: grizzly-platform/gameservers-web-demo.
#
# OnChange because 1Password meters requests per account per day. To rotate,
# generate a line with `openssl passwd -apr1`, store it under a field name the
# item hasn't used before, point remoteRef at that field, and delete the old
# one. Editing the existing field and force-syncing doesn't work: the
# onepassword ClusterSecretStore caches each value for an hour and re-serves
# the old one, and ESO reverts a hand-patched Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gary-web-basic-auth
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gary-web-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: gameservers-web-demo/judges_htpasswd
---
# What live mode needs, read by the pod's nginx at start (web/nginx.conf.template):
# the operator harness bearer token, added to every proxied /operator request,
# and the Discord channel Gary's replies and audit lines are posted to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gary-web-live
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gary-web-live
    creationPolicy: Owner
  data:
    - secretKey: GARY_OPERATOR_TOKEN
      remoteRef:
        key: gameservers-operator/token
    - secretKey: GARY_CHANNEL
      remoteRef:
        key: gameservers-web-demo/channel
