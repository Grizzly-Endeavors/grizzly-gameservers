# The web console's deployment, rendered by its own Flux Kustomization
# (grizzly-gameservers-web in grizzly-platform), separate from the bot's
# HelmRelease. .github/workflows/web.yml pins the image digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gary-web
resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: gary-web
    newName: registry.registry.svc.cluster.local:5000/gary-web
    digest: sha256:a5478207beae2980022da89b315917fdb0b53ce2f627ab0b04e7bb0789c0d143
