# The web console's deployment, rendered by its own Flux Kustomization
# (grizzly-gameservers-web in grizzly-platform), separate from the bot's
# HelmRelease. .github/workflows/web.yml pins the image digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gary-web
resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: gary-web
    newName: registry.registry.svc.cluster.local:5000/gary-web
    digest: sha256:4ddcea6f4decf480ce345b85a6e3c25988144a89975be132396d01ec996fe6d9
