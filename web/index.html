<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gary</title>
    <!-- Apply the theme before first paint so nobody sees a flash of the wrong one.
         Dark is the default; someone who chose light keeps it (see src/app/theme.tsx). -->
    <script>
      try {
        if (localStorage.getItem('gary-theme') !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta name="theme-color" content="#141517" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
