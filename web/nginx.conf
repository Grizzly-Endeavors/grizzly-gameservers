server {
    listen 8080;
    root /usr/share/nginx/html;

    # The deployed console is replay-only: the operator harness holds an admin
    # bearer token, so it is never proxied from a public host. The app reads
    # this as "harness unreachable" and stays on Replay.
    location /operator {
        return 404;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
