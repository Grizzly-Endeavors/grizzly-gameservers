# Build → deploy for the web console, independent of the bot's deploy.yml: its
# own trigger paths, its own image, its own concurrency group, and its own
# pin file (web/deploy/kustomization.yaml), which a separate Flux
# Kustomization renders. A web push never rebuilds the bot and a bot push
# never rebuilds the web console.
name: Web Console
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # Manifest-only changes need no new image; Flux applies them directly.
      - "!web/deploy/**"
      - ".github/workflows/web.yml"

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  REGISTRY: registry.registry.svc.cluster.local:5000
  IMAGE_NAME: gary-web

jobs:
  build-and-pin:
    runs-on: lab-runners
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build and push via BuildKit registry cache
        run: |
          set -euo pipefail
          # Same builder setup as deploy.yml: buildkitd ignores dockerd's mirror
          # and insecure-registry flags, so declare both here.
          cat > /tmp/buildkitd.toml <<'TOML'
          [registry."docker.io"]
            mirrors = ["registry.registry.svc.cluster.local:5000"]
          [registry."registry.registry.svc.cluster.local:5000"]
            http = true
          TOML
          docker buildx create --name ci \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.31.2 \
            --config /tmp/buildkitd.toml
          docker buildx build --builder ci -f web/Dockerfile \
            --cache-from "type=registry,ref=$REGISTRY/$IMAGE_NAME:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY/$IMAGE_NAME:buildcache,mode=max,oci-mediatypes=true,image-manifest=true" \
            --output "type=registry,name=$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}" \
            --provenance=false --sbom=false \
            web
      - name: Pin digest and commit
        run: |
          set -euo pipefail
          DIGEST=$(curl -fsSI \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "http://$REGISTRY/v2/$IMAGE_NAME/manifests/${GITHUB_SHA}" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::could not resolve a sha256 digest for ${GITHUB_SHA}: '${DIGEST}'"; exit 1 ;;
          esac
          export DIGEST
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main moves under us (the bot's deploy.yml commits its own pin), so
          # pin onto the latest main and retry on a lost push race. The two
          # workflows write different files, so a rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B pin origin/main
            docker run --rm -i -e DIGEST mikefarah/yq:4.53.3@sha256:11a1f0b604b13dbbdc662260d8db6f644b22d8553122a25c1b5b2e8713ca6977 \
              '(.images[] | select(.name == "gary-web")).digest = strenv(DIGEST)' \
              < web/deploy/kustomization.yaml > web/deploy/kustomization.yaml.tmp
            mv web/deploy/kustomization.yaml.tmp web/deploy/kustomization.yaml
            git add web/deploy/kustomization.yaml
            if git diff --cached --quiet; then
              echo "web/deploy/kustomization.yaml already pins ${DIGEST}"
              exit 0
            fi
            git commit -m "ci: deploy web console image [skip ci]" -m "image: ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            if git push origin HEAD:main; then exit 0; fi
            echo "push lost a race with another commit to main (attempt ${attempt}); retrying"
            sleep $((attempt * 2))
          done
          echo "::error::could not push the web console pin after 5 attempts"
          exit 1
