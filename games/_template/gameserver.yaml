# Skeleton for a new game. Copy this directory to games/<game>/ and replace the
# REPLACE_* placeholders. The pod is hardened except for the two *rootless*
# controls (runAsNonRoot / readOnlyRootFilesystem), matching every current game:
# their upstream bases bootstrap as root (chown the data dir, then drop
# privileges) — see the pod-hardening comment below the labels. Seccomp, no
# privilege escalation and a minimal capability set are applied and are not
# optional; a documented nosemgrep block covers the two that are unset. If your
# game's base genuinely runs rootless, restore the full baseline (this
# directory's README documents it).
#
# The image bakes in the grizzly supervisor as its entrypoint (Dockerfile in
# this directory): it launches the game as a child, owns the Agones SDK
# lifecycle (calls /ready once the game accepts connections, then keeps
# /health pinged — including while the game is paused), and serves an in-pod
# control API on 9359 that the bot drives for in-place stop/start/restart and
# Gary's file/RCON tools. See games/minecraft/ for a filled-in, worked example.
apiVersion: agones.dev/v1
kind: GameServer
metadata:
  name: REPLACE_GAME            # e.g. minecraft, valheim
  namespace: game-servers
spec:
  # Names which container owns the game port (the pod is multi-container:
  # Agones injects its own SDK sidecar alongside this one).
  container: REPLACE_GAME
  ports:
    - name: REPLACE_GAME
      # None: Agones doesn't manage a hostPort; reachability is the NodePort
      # Service (service.yaml). kube-proxy routes to the pod on any node, so no
      # node-pinning — see docs/decisions/002-nodeport-no-node-pin.md.
      portPolicy: None
      containerPort: 0          # REPLACE with the game's listen port
      protocol: TCP             # REPLACE (UDP for many games; see note in README)
  health:
    # Give the server time to boot before Agones starts health-gating it.
    initialDelaySeconds: 180
    periodSeconds: 15
    failureThreshold: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: REPLACE_GAME
    # Two hardening controls are unset here, and only two: runAsNonRoot and
    # readOnlyRootFilesystem. The common self-hosted-game bases (itzg, factoriotools,
    # thijsvanloef, wolveix, lloesche, ryshe, and similar) bootstrap as root — they
    # chown the mounted data dir to a configurable PUID/PGID, then drop privileges
    # (gosu/su-exec) before launching the game — and both controls break that
    # bootstrap. Nothing else is waived: seccomp is applied at the pod level below,
    # and the container drops every capability the bootstrap doesn't use. This is the
    # one pod that executes mods, plugins and datapacks chosen by people we don't
    # vet, so the gap between "runs as root" and "runs unconfined" is worth closing
    # even while the root bootstrap stands. Three nosemgrep lines cover the two unset
    # controls — runAsNonRoot trips a rule at the pod level and another at the
    # container level, readOnlyRootFilesystem one more.
    #
    # If your game's base genuinely runs rootless (no root chown on startup), it is
    # the exception: DELETE all three nosemgrep lines, add runAsNonRoot/runAsUser/
    # runAsGroup/fsGroup to the pod securityContext, set readOnlyRootFilesystem: true
    # with a writable /tmp emptyDir, and drop the capability add-back list — this
    # directory's README documents that full rootless baseline.
    # nosemgrep: yaml.kubernetes.security.run-as-non-root
    spec:
      # RuntimeDefault is the container runtime's own seccomp filter — the same one
      # each of these images already runs under in plain Docker, and the biggest
      # single barrier between a kernel exploit in mod code and the node. Kubernetes
      # does not apply it by default: an unset seccompProfile means Unconfined, so
      # this has to be stated to be true.
      # nosemgrep: yaml.kubernetes.security.run-as-non-root-security-context-pod-level
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The kubelet SIGKILLs the pod this long after SIGTERM. Must stay ≥ this
      # game's graceful save window: the supervisor is PID 1 and catches SIGTERM to
      # save the world within that window, so a shorter grace period truncates the
      # save mid-write. The window is DEFAULT_GRACEFUL_TIMEOUT_SECS (90s, in
      # crates/control-api) unless this game's Dockerfile raises it with
      # SUPERVISOR_GRACEFUL_TIMEOUT_SECS — if it does, raise this to match. 120
      # leaves comfortable margin over the default. A drift guard in the bot crate's
      # tests/config.rs reads each game's effective window and keeps both this value
      # and the bot's control-client timeout clear of it.
      terminationGracePeriodSeconds: 120
      containers:
        # nosemgrep: yaml.kubernetes.security.writable-filesystem-container
        - name: REPLACE_GAME
          # REPLACE_IMAGE: the composite image from this directory's Dockerfile
          # (grizzly supervisor as PID 1, wrapping the game as its child). CI
          # replaces the tag with the gate-signed digest (ADR-020).
          image: REPLACE_IMAGE          # pin a tag/digest — no floating :latest
          securityContext:
            # A root bootstrap that drops privileges is unaffected by this:
            # no_new_privs blocks *gaining* privilege, and gosu/su-exec only shed it.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Exactly what the root bootstrap uses and nothing more: chown/chmod the
              # mounted data dir (CHOWN, DAC_OVERRIDE, FOWNER), become the game user
              # (SETUID, SETGID), and signal that now-unprivileged child as PID 1
              # (KILL — root stripped of this capability cannot signal another uid).
              # The rest of Docker's default set is gone, NET_BIND_SERVICE included:
              # no game here listens on a privileged port.
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
          # REPLACE with the game's config env. If this game enables the in-game
          # chat → Gary reverse loop (SUPERVISOR_CHAT_FORMAT in the Dockerfile),
          # also wire these three, matching games/minecraft/gameserver.yaml:
          #   - name: SUPERVISOR_GAMESERVER_NAME
          #     valueFrom:
          #       fieldRef:
          #         fieldPath: metadata.labels['agones.dev/gameserver']
          #   - name: SUPERVISOR_AGENT_URL
          #     value: "http://grizzly-gameservers-agent.game-servers.svc.cluster.local:9360/ingame-trigger"
          #   - name: SUPERVISOR_AGENT_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: grizzly-gameservers-ingame
          #         key: ingame_token
          #         optional: true
          # Required on every call the bot makes to this pod's control API.
          # Defence in depth behind the egress leash: optional, so an
          # unprovisioned token leaves the pod on the NetworkPolicy-only posture
          # rather than refusing every lifecycle action.
          env:
            - name: SUPERVISOR_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-control
                  key: control_token
                  optional: true
          ports:
            - name: REPLACE_GAME
              containerPort: 0          # REPLACE (match spec.ports.containerPort)
              protocol: TCP
            # Pod-internal control API the bot/Gary reach over the cluster
            # network for /stop, /start, /restart and the file/RCON tools.
            # Deliberately not exposed via the NodePort Service.
            - name: control
              containerPort: 9359
              protocol: TCP
          # readOnlyRootFilesystem is the one container control left unset — the base
          # writes outside the data volume during its root bootstrap. The nosemgrep on
          # the container line above covers exactly that.
          volumeMounts:
            - name: data
              mountPath: /data          # REPLACE with the game's data dir
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # Whole-CPU limit — fractional limits cause throttling and the gate
              # flags them. Size to the game; omit the limit entirely if bursting
              # is preferable to a hard cap.
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: REPLACE_GAME-data
