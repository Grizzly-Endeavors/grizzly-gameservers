# Valheim catalog entry — an on-demand GameServer template. The bot renders it
# per `/create` into a uniquely-named instance (this name/labels are placeholders
# the renderer overrides); nothing here runs until a friend asks for it.
#
# Valheim has no native RCON, so the image bakes in BepInEx + the ValheimRcon mod
# (Dockerfile) to give Gary live console commands and the supervisor a player count.
# The RCON port is pod-internal (loopback) and never added to a NodePort Service.
# Valheim is UDP-only for the game itself, so the supervisor still signals Agones
# Ready off a log marker (SUPERVISOR_READY_LOG_PATTERN) rather than a TCP probe.
#
# The image bakes in the grizzly supervisor as its entrypoint (games/valheim/
# Dockerfile): it launches lloesche's server as a child, owns the Agones SDK
# lifecycle, and serves an in-pod control API on 9359 that the bot drives for
# in-place stop/start/restart, Gary's file + console tools, and the auto-updater.
#
# Only the game port (2456/udp) is exposed. Friends join by direct connect
# (IP:port), which uses the game port; the +1 query port only matters for the
# Steam server browser, which the NodePort remap wouldn't satisfy anyway.
#
# portPolicy: None — reachability is via the NodePort Service the bot leases per
# instance.
apiVersion: agones.dev/v1
kind: GameServer
metadata:
  name: valheim
  namespace: game-servers
  annotations:
    # Where this game's mods come from; see games/minecraft/gameserver.yaml for
    # what the bot does with it. Thunderstore is per game, so the community slug
    # is part of the registry's identity rather than a search filter — packages
    # never cross between communities, and the pair is required together.
    grizzly-gameservers.grizzly-endeavors.com/mod-registry: thunderstore
    grizzly-gameservers.grizzly-endeavors.com/thunderstore-community: valheim
spec:
  container: valheim
  ports:
    - name: valheim
      portPolicy: None
      containerPort: 2456
      protocol: UDP
  health:
    # Valheim installs its server via SteamCMD on first boot and generates the
    # world before it's joinable; give it room before Agones health-gates it.
    initialDelaySeconds: 300
    periodSeconds: 15
    # Wider than the catalog's usual 5 because a rolled-back mod list has to be
    # repaired *inside* this window: the bot restores the file's snapshot and
    # restarts, and that restart re-resolves the mod list and may re-download it.
    # At 5 the repair could still be downloading when Agones gave up on the pod.
    failureThreshold: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valheim
    # runAsNonRoot / readOnlyRootFilesystem are the only two hardening controls this
    # pod leaves unset, matching the other game pods (supervisor as PID 1, base
    # bootstraps as root). The rest of the baseline is applied below; see
    # games/_template/gameserver.yaml.
    # nosemgrep: yaml.kubernetes.security.run-as-non-root
    spec:
      # The runtime's own seccomp filter. Kubernetes leaves this Unconfined unless
      # set; see games/_template/gameserver.yaml.
      # nosemgrep: yaml.kubernetes.security.run-as-non-root-security-context-pod-level
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # SIGKILL grace after SIGTERM. Must stay ≥ this game's graceful save window
      # so the world-save finishes; see games/_template/gameserver.yaml. Valheim's
      # save runs long enough that its image raises that window to 120s
      # (SUPERVISOR_GRACEFUL_TIMEOUT_SECS in games/valheim/Dockerfile), so this is
      # 150 rather than the catalog's usual 120 — at 120 the kubelet's SIGKILL would
      # land on the same tick the supervisor's own timeout fires, leaving the save
      # no margin at all.
      terminationGracePeriodSeconds: 150
      containers:
        # nosemgrep: yaml.kubernetes.security.writable-filesystem-container
        - name: valheim
          # Composite image: grizzly supervisor (PID 1) wrapping lloesche's server.
          # CI replaces the tag with the gate-signed digest (ADR-020).
          image: registry.registry.svc.cluster.local:5000/grizzly-gameservers-valheim:dev
          # Dev-only: the mutable :dev tag means nodes would cache a stale image
          # under the default IfNotPresent. Always re-pull so a fresh push lands.
          # Superseded once CI pins a gate-signed digest (digests are immutable).
          imagePullPolicy: Always
          securityContext:
            # The base's privilege drop still works — no_new_privs blocks only the
            # *gaining* of privilege. The capability set is the root bootstrap's
            # working set: chown the data dir, become the game user, signal the child
            # as PID 1. See games/_template/gameserver.yaml.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
          ports:
            - name: valheim
              containerPort: 2456
              protocol: UDP
            # Pod-internal control API the bot reaches over the cluster network.
            - name: control
              containerPort: 9359
              protocol: TCP
          # Required on every call the bot makes to this pod's control API.
          # Defence in depth behind the egress leash: optional, so an
          # unprovisioned token leaves the pod on the NetworkPolicy-only posture
          # rather than refusing every lifecycle action.
          env:
            - name: SUPERVISOR_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-control
                  key: control_token
                  optional: true
            # Per-instance mod list. Which file an instance may list mods in is
            # per-game *policy*, so it lives here where changing it is a
            # reviewable catalog edit that lands on the next /create — the rest
            # of the reconciler's settings are facts about the image and live in
            # games/valheim/Dockerfile. Both halves are required together; with
            # only this one the supervisor warns and leaves mods off.
            #
            # Gary edits this file through the ordinary file tools, which is the
            # whole point: the edit is snapshotted, the restart verifies it, and
            # a list that stops the server is rolled back automatically.
            - name: SUPERVISOR_MODS_FILE
              value: ".grizzly/mods"
          volumeMounts:
            - name: data
              mountPath: /config
          resources:
            # Valheim wants a couple of cores and a few GB; size generously.
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valheim-data
