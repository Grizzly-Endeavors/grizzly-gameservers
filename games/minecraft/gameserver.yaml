# Minecraft catalog entry — an on-demand GameServer template. The bot renders it
# per `/create` into a uniquely-named instance (this name/labels are placeholders
# the renderer overrides); nothing here runs until a friend asks for it.
#
# The image bakes in the grizzly supervisor as its entrypoint (games/minecraft/
# Dockerfile): it launches itzg's server as a child, owns the Agones SDK
# lifecycle (calls /ready once the game accepts connections on 25565, then keeps
# /health pinged — including while the game is paused), and serves an in-pod
# control API on 9359 that the bot drives for in-place stop/start/restart and
# Gary's file/RCON tools.
#
# portPolicy: None — reachability is via the NodePort Service the bot leases per
# instance (kube-proxy routes to the pod on whatever node it lands).
apiVersion: agones.dev/v1
kind: GameServer
metadata:
  name: minecraft
  namespace: game-servers
  annotations:
    # Where this game's mods come from. The bot reads it at catalog load and
    # points `search_mods`/`mod_info` at that registry; a game without it takes
    # no mods through Gary at all. Declared here rather than in Rust so
    # onboarding a moddable game stays a reviewable catalog edit.
    grizzly-gameservers.grizzly-endeavors.com/mod-registry: modrinth
spec:
  # Agones injects its SDK sidecar, so the pod is multi-container; name the one
  # that owns the game port.
  container: minecraft
  ports:
    - name: minecraft
      portPolicy: None
      containerPort: 25565
      protocol: TCP
  health:
    # Minecraft world generation can take a while on first boot; don't let
    # Agones mark the server Unhealthy before the supervisor starts pinging
    # /health (it does so only once the game is accepting connections).
    initialDelaySeconds: 180
    periodSeconds: 15
    # 150s of missed pings before Agones condemns the pod. That window is the
    # supervisor's recovery budget after a crash escalation: the bot answers a
    # failed config change by restoring the file's snapshot and restarting, and
    # the heartbeat only resumes once the repaired child is accepting
    # connections. A modded Minecraft boot re-resolves its Modrinth downloads
    # before the world even loads, so the 75s a threshold of 5 would give is not
    # enough for that repair to land.
    failureThreshold: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
    # runAsNonRoot / readOnlyRootFilesystem are the only two hardening controls this
    # pod leaves unset: the composite image runs the supervisor as PID 1 wrapping
    # itzg/minecraft-server, which bootstraps as root (chowns /data, writes outside
    # the world volume) and breaks under either. The rest of the baseline is applied
    # below; see games/_template/gameserver.yaml for the reasoning.
    # nosemgrep: yaml.kubernetes.security.run-as-non-root
    spec:
      # The runtime's own seccomp filter. Kubernetes leaves this Unconfined unless
      # set; see games/_template/gameserver.yaml.
      # nosemgrep: yaml.kubernetes.security.run-as-non-root-security-context-pod-level
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # SIGKILL grace after SIGTERM. Must stay ≥ this game's graceful save window
      # so the world-save finishes; see games/_template/gameserver.yaml.
      terminationGracePeriodSeconds: 120
      containers:
        # nosemgrep: yaml.kubernetes.security.writable-filesystem-container
        - name: minecraft
          # Composite image: grizzly supervisor (PID 1) wrapping itzg's server.
          # CI replaces the tag with the gate-signed digest (ADR-020).
          image: registry.registry.svc.cluster.local:5000/grizzly-gameservers-minecraft:dev
          # Dev-only: the mutable :dev tag means nodes would cache a stale image
          # under the default IfNotPresent. Always re-pull so a fresh push lands.
          # Superseded once CI pins a gate-signed digest (digests are immutable).
          imagePullPolicy: Always
          securityContext:
            # itzg's su-exec drop still works — no_new_privs blocks only the *gaining*
            # of privilege. The capability set is the root bootstrap's working set:
            # chown /data, become the game user, signal the child as PID 1. See
            # games/_template/gameserver.yaml.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
          env:
            # Required on every call the bot makes to this pod's control API.
            # Defence in depth behind the egress leash: optional, so an
            # unprovisioned token leaves the pod on the NetworkPolicy-only
            # posture rather than refusing every lifecycle action.
            - name: SUPERVISOR_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-control
                  key: control_token
                  optional: true
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: "2G"
            # Pinned, not LATEST: mod compatibility is scoped to a Minecraft
            # version, so an unpinned server would silently break its own mod set
            # the first time upstream ships a release. An instance that needs a
            # newer version raises it through the overlay below — never lower it,
            # since world formats upgrade one way.
            - name: VERSION
              value: "26.2"
            # In-game chat → Gary reverse loop. The chat watcher forwards a
            # player's `@Gary` message to the bot's agent endpoint, which answers
            # read-only and broadcasts the reply back over RCON. The GameServer
            # name (from the pod's Agones label) tells the bot which server —and so
            # which guild scope— the question came from. The token authenticates
            # the POST; it's optional so an unprovisioned secret leaves the watcher
            # running unauthenticated (NetworkPolicy-protected) rather than failing.
            - name: SUPERVISOR_GAMESERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['agones.dev/gameserver']
            - name: SUPERVISOR_AGENT_URL
              value: "http://grizzly-gameservers-agent.game-servers.svc.cluster.local:9360/ingame-trigger"
            - name: SUPERVISOR_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-ingame
                  key: ingame_token
                  optional: true
            # Mods and datapacks. The supervisor injects allowlisted keys from
            # /data/.grizzly/env into itzg's environment before each launch, and
            # itzg re-resolves its Modrinth downloads on every start — so Gary
            # edits one file and restarts in place. The allowlist is the whole
            # mutable surface: loader and version (mod compatibility is scoped to
            # both), the slug list, and its dependency/release-channel knobs.
            # Everything else about the server stays a catalog decision.
            #
            # Deliberately no MODS/PLUGINS/DATAPACKS: those take arbitrary URLs,
            # and every installed artifact must come from a moderated registry by
            # slug so provenance survives an agent being talked into a bad link.
            #
            # MEMORY is the JVM heap, and it is on the allowlist because the
            # pod's memory limit and the heap are separate numbers: an in-place
            # resize (set_resources) raises the pod's ceiling live, but the heap
            # is fixed at launch, so without this the flagship game's memory
            # lever only ever half works. Overlaid per instance and applied by a
            # restart, like every other value here.
            #
            # These live here rather than in the Dockerfile ENV (where the rest
            # of this game's SUPERVISOR_* tuning sits) because the allowlist is
            # per-game *policy*: changing it should be a reviewable catalog edit
            # that lands on the next /create, not an image rebuild.
            - name: SUPERVISOR_CHILD_ENV_FILE
              value: ".grizzly/env"
            - name: SUPERVISOR_CHILD_ENV_ALLOWLIST
              value: "TYPE,VERSION,MEMORY,MODRINTH_PROJECTS,MODRINTH_DOWNLOAD_DEPENDENCIES,MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            # Pod-internal control API the bot reaches over the cluster network.
            # Deliberately not exposed via the NodePort Service.
            - name: control
              containerPort: 9359
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
