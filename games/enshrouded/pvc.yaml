# Per-instance Enshrouded state under /home/steam/enshrouded: the whole server
# install (~8.8 GB, kept here so a cold start doesn't re-download it), the
# config, the world saves and their rolling backups. The ops agent mutates files
# here live; it is friend state, not infra, and is never committed to git.
# iscsi-zfs (default, RWO) is network block storage, so it reattaches across
# nodes and the pod can still land anywhere. Sized for the install plus the
# headroom steamcmd needs to stage an update beside it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enshrouded-data
  namespace: game-servers
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: iscsi-zfs
  resources:
    requests:
      storage: 30Gi
