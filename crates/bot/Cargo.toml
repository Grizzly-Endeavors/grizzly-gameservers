[package]
name = "grizzly-gameservers"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
# Codegen face: build.rs calls emit() to compile prompts/ into $OUT_DIR/prompts.rs.
# Pinned to the same rev as the grizzly-agent and grizzly-agent-prompts edges below —
# two copies of core would make generated ToolSpecs fail to type-check against the
# facade's (design §"External touchpoints" / "Git dependency resolution").
grizzly-agent-prompts = { git = "https://github.com/Grizzly-Endeavors/grizzly-agent", rev = "590f7acc3429136cb4a2a7b99c93511998eb1822", features = [
    "codegen",
] }

[dependencies]
anyhow = "1.0.103"
# Holds the operator-tunable settings snapshot (crate::settings). Reads are on
# per-event hot paths that are already synchronous — guild admission, a turn's
# config capture — and vastly outnumber writes, which only happen when the
# operator changes a knob. The whole snapshot is swapped as one Arc, which is
# what makes a reader unable to observe half of a multi-field change.
arc-swap = "1.9.2"
# Encodes the Langfuse key pair into the OTLP exporter's HTTP Basic header.
base64 = "0.22.1"
dotenvy = "0.15.7"
# Mints the opaque per-transcript session id off the system CSPRNG. Same crate
# (and same use) as the supervisor's rcon password minting.
getrandom = "0.4.3"
grizzly-control-api = { path = "../control-api", version = "0.1.0" }
# ToolSpec, ToolDefinition, and NoParams — generated tool specs assemble into
# ToolSpec, and this edge is also where a future move onto ToolSet/ToolHandler
# would draw from. default-features stays empty: this crate is core alone, no
# provider/skills/eval machinery.
grizzly-agent = { git = "https://github.com/Grizzly-Endeavors/grizzly-agent", rev = "590f7acc3429136cb4a2a7b99c93511998eb1822", default-features = false }
k8s-openapi = { version = "0.28.0", features = ["v1_33"] }
# Langfuse turn telemetry. Only the trace signal and the primitive span types are
# used: spans are built as `SpanData` literals and handed straight to a
# `BatchSpanProcessor`, because 0.32's `SpanBuilder` can no longer carry a
# caller-minted span id — and a turn's child observations must name the root's
# span id before the root exists. See ADR-013.
# `internal-logs` routes the SDK's own diagnostics through `tracing`, so a failed
# export lands in the bot's logs instead of vanishing. Without it an unreachable
# or rejecting Langfuse is completely silent — the subsystem reports "enabled" at
# startup and then drops every span.
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "internal-logs"] }
# `reqwest-blocking-client` is not a preference: the default BatchSpanProcessor
# runs on a dedicated std thread and does not support async HTTP clients. Its
# reqwest dependency is default-features = false, so no TLS backend is pulled and
# the native-tls/rustls split the deps below curate is untouched — in-cluster
# Langfuse is plain HTTP, the same as Postgres/Valkey/S3.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
# Client for the in-pod supervisor control API. Default (native-tls) backend
# unifies with serenity's; the control calls themselves are plaintext http to
# pod IPs.
reqwest = { version = "0.12", features = ["json", "stream"] }
# axum serves the inbound agent endpoint game-pod supervisors POST in-game `@Gary`
# triggers to; matches the version the supervisor's control API already uses.
axum = "0.8.7"
# Compile-time HTML for the admin panel. Templates are Rust macros rather than a
# second language with its own files, so a page that references a field that
# stopped existing fails the build instead of at render time — and the markup is
# embedded in the binary, which the pod's readOnlyRootFilesystem requires anyway.
maud = "0.27.0"
# `ring` explicitly selects rustls' crypto provider so rustls 0.23 can install a
# process default; without it kube's rustls-tls enables no provider and the
# client panics at startup ("could not automatically determine the CryptoProvider").
kube = { version = "4.0.0", default-features = false, features = ["client", "derive", "rustls-tls", "ring"] }
poise = { version = "0.6.2", default-features = false, features = [
    "cache",
    "chrono",
    "handle_panics",
] }
# poise pulls serenity with no TLS backend (its default added rustls_backend,
# which we dropped above). Select native_tls_backend directly so serenity stays
# off the unmaintained rustls 0.22 -> rustls-webpki 0.102 chain
# (RUSTSEC-2026-0104, no published serenity yet bumps it). kube keeps its own
# current rustls 0.23 via its rustls-tls feature. Feature unification merges
# this with poise's serenity feature set.
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
# Bot's durable state (the no-mention "home" channel registry) on foundation
# Postgres. No TLS feature: the connection is plain TCP to the LAN foundation
# store, so this stays off the rustls/native-tls chains the deps above curate.
# Runtime query API only (no compile-time `query!` macro), so CI needs no live DB.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
# Redis-wire client for the shared foundation kv-cache (Valkey) — backs Gary's
# deferred-task queue (run_when). ConnectionManager is an auto-reconnecting,
# cloneable, multiplexed connection, so no pool is needed at this scale. No TLS
# feature: the connection is plain TCP to the LAN foundation store, keeping this
# off the rustls/native-tls chains the deps above curate.
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager"] }
# Sole remaining consumer is src/agones/types.rs: kube's CustomResource derive
# requires JsonSchema. Tool schemas moved to prompt-lib codegen (no schemars).
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "time",
    "sync",
] }
# CancellationToken + TaskTracker back the graceful-shutdown drain: signal cancels
# the token (backup cycle, in-game server), then the tracker awaits in-flight work.
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Maintained drop-in fork of serde_yaml (which is unmaintained, RUSTSEC-2024-0370).
# Parses the per-game catalog templates in games/ into kube/k8s-openapi types.
serde_yaml_ng = "0.10.0"
# Reads and writes r2modman profile payloads, which are a zip inside a base64
# blob. Same pin and same pure-Rust deflate backend as the supervisor's, so the
# two halves of mod management share one archive stack rather than two.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
rusty-s3 = "0.10.0"
url = "2.5.8"
jiff = "0.2.31"
# Transactional mail: the beta-approval message the signup queue sends. Defaults
# off because they select lettre's *synchronous* transport plus connection
# pooling — we want the tokio one, and no pool: the volume is a handful of
# human-clicked sends, and a warm connection against a per-IP auto-banning
# submission server is a liability rather than an optimization.
# `tokio1-native-tls`, not `tokio1-rustls`, to unify with the backend serenity is
# already pinned to above and reqwest already pulls; a fourth TLS configuration
# would risk deny.toml's multiple-versions check for nothing.
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
    "hostname",
] }

[dev-dependencies]
# Verify face: the conventional annotations test (tests/prompt_annotations.rs)
# cross-checks each prompt file's used_by entries against the source tree.
grizzly-agent-prompts = { git = "https://github.com/Grizzly-Endeavors/grizzly-agent", rev = "590f7acc3429136cb4a2a7b99c93511998eb1822", features = [
    "verify",
] }
# `testing` brings InMemorySpanExporter, which lets the turn-shape test assert a
# simulated turn's span tree (one root, correct parentage) without a collector.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }

[lints]
workspace = true
