id: mc-properties-s2
scenario: mc-properties
split: scored
game: minecraft
kind: config
task_area: config
prompt: people keep getting kicked for 'flying' when they're just using the elytra stuff, stop that, and bump the view distance up to 12
setup:
- tool: edit_file
  args:
    path: server.properties
    old_text: view-distance=10
    new_text: view-distance=6
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^allow-flight=true$
  present: true
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^view-distance=12$
  present: true
