prompt: factorio won't load anymore after i switched on the robo helpers mod
setup:
- pod_exec: sh -c 'mkdir -p /factorio/mods/tidy-signs_0.4.1 && echo eyJuYW1lIjoidGlkeS1zaWducyIsInZlcnNpb24iOiIwLjQuMSIsInRpdGxlIjoidGlkeS1zaWducyIsImF1dGhvciI6ImV2YWwiLCJmYWN0b3Jpb192ZXJzaW9uIjoiMi4wIiwiZGVwZW5kZW5jaWVzIjpbImJhc2UgPj0gMi4wLjAiXX0= | base64 -d > /factorio/mods/tidy-signs_0.4.1/info.json && mkdir -p /factorio/mods/robo-helpers_1.2.0 && echo eyJuYW1lIjoicm9iby1oZWxwZXJzIiwidmVyc2lvbiI6IjEuMi4wIiwidGl0bGUiOiJyb2JvLWhlbHBlcnMiLCJhdXRob3IiOiJldmFsIiwiZmFjdG9yaW9fdmVyc2lvbiI6IjIuMCIsImRlcGVuZGVuY2llcyI6WyJiYXNlID49IDIuMC4wIiwibmFub2JvdHMtY29yZSA+PSAxLjAuMCJdfQ== | base64 -d > /factorio/mods/robo-helpers_1.2.0/info.json && echo  | base64 -d > /factorio/mods/mod-list.json && chown
    -R factorio:factorio /factorio/mods'
- restart: true
- wait: log
  pattern: Missing required dependency
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[x]64/factorio --port"'
  expect_exit: 0
- type: file_regex
  path: /factorio/mods/mod-list.json
  pattern: (?s)"name":\s*"tidy-signs",\s*"enabled":\s*false
  present: false
- type: pod_exec
  cmd: sh -c 'ls -d /factorio/mods/tidy-signs_* >/dev/null'
  expect_exit: 0
