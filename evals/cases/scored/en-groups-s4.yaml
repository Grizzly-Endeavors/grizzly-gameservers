id: en-groups-s4
scenario: en-groups
split: scored
game: enshrouded
kind: access
task_area: config
prompt: I think someone outside our group got the friends password. change it to sundial31 but keep mine the same
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-groups-s4.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e '.userGroups | any(.name=="Friend" and .password=="oldfriend")' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e '.userGroups | any(.name=="Friend" and .password=="sundial31")' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e '.userGroups | any(.name=="Admin" and .password=="ownerPw5512")' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
