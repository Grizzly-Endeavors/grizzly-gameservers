id: mc-install-mod-s2
scenario: mc-install-mod
split: scored
game: minecraft
kind: mods
task_area: config
prompt: someone griefed our base again. is there a mod that lets us see who broke what and roll it back? Ledger I think it's called
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MODRINTH_PROJECTS=ferrite-core,spark

      MODRINTH_DOWNLOAD_DEPENDENCIES=required

      '
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "ledger"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "ferrite[-]?core"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "spark"'
  expect_exit: 0
