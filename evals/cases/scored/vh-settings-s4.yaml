id: vh-settings-s4
scenario: vh-settings
split: scored
game: valheim
kind: config
task_area: config
prompt: crossplay is causing trouble for us, switch it off
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_NAME=Hall of Ash

      CROSSPLAY=1

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^CROSSPLAY=(1|true)$
  present: false
