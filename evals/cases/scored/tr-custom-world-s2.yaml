id: tr-custom-world-s2
scenario: tr-custom-world
split: scored
game: terraria
kind: world
task_area: config
prompt: my buddy sent me his world (Crimson_Tide) and I dropped it on there. load it up so we can play
  it tonight
setup:
- pod_put:
    src: evals/fixtures/terraria/small-world.wld
    dst: /data/worlds/Crimson_Tide.wld
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/config/serverconfig.txt
  pattern: (?m)^world=.*Crimson_Tide\.wld\s*$
  present: true
- type: pod_exec
  cmd: sh -c 'test -s /data/worlds/grizzly.wld'
  expect_exit: 0
