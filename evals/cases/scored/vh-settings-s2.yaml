id: vh-settings-s2
scenario: vh-settings
split: scored
game: valheim
kind: config
task_area: config
prompt: we keep getting random people in the server browser, can you hide the server from the public list
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_NAME=Longship Landing

      SERVER_PUBLIC=1

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^SERVER_PUBLIC=(0|false)$
  present: true
