id: tr-settings-s2
scenario: tr-settings
split: scored
game: terraria
kind: config
task_area: config
prompt: turn on the whitelist and add my IP, it's 203.0.113.42
setup:
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: json_equals
  path: /data/config/config.json
  key: Settings.EnableWhitelist
  equals: true
- type: file_regex
  path: /data/config/whitelist.txt
  pattern: (?m)^203\.0\.113\.42\s*$
  present: true
