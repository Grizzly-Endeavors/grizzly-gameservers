id: tr-config-broken-s1
scenario: tr-config-broken
split: scored
game: terraria
kind: fix
task_area: troubleshooting
prompt: terraria server isn't acting right since I bumped the spawn protection, my settings don't seem
  to be taking
setup:
- pod_exec: 'sed -i -E ''s/(SpawnProtectionRadius[^0-9]*)10,/\1 25,/;s/("ApplicationRestTokens": \{\})$/\1,/''
    /data/config/config.json'
- restart: true
- wait: log
  pattern: Server started
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: jq -e type /data/config/config.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e .Settings.RestApiEnabled==true /data/config/config.json
  expect_exit: 0
- type: json_equals
  path: /data/config/config.json
  key: Settings.SpawnProtectionRadius
  equals: 25
