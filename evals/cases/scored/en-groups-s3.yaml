id: en-groups-s3
scenario: en-groups
split: scored
game: enshrouded
kind: access
task_area: config
prompt: the people who join with the visitor password keep wrecking things, make it so they can't build or destroy stuff
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-groups-s3.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e --arg n Visitors '.userGroups | any(.name==$n and .canEditWorld==true and .canEditBase==true)' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg n Visitors '.userGroups | any(.name==$n and .canEditWorld==false and .canEditBase==false and .canKickBan==false)' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg n Visitors --arg p dropin77 '.userGroups | any(.name==$n and .password==$p)' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
