- type: pod_exec
  cmd: jq -e --arg n 'Starfall Reach' '.name==$n' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg p wardenpass3 '.userGroups | any(.name=="Admin" and .password==$p)' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg p reachfolk44 '.userGroups | any(.name=="Friend" and .password==$p)' /home/steam/enshrouded/enshrouded_server.json
