id: en-game-settings-s2
scenario: en-game-settings
split: scored
game: enshrouded
kind: config
task_area: config
prompt: the nights are so long and boring, make them half as long
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-game-settings-s2.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e '.gameSettingsPreset=="Default" and .gameSettings.nightTimeDuration' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e '.gameSettingsPreset=="Custom" and .gameSettings.nightTimeDuration<720000000000 and .gameSettings.nightTimeDuration>0' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
