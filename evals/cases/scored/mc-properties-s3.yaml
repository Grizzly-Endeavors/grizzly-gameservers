id: mc-properties-s3
scenario: mc-properties
split: scored
game: minecraft
kind: config
task_area: config
prompt: no more monsters please, we just want to chill and build. also the server list should say Brewhaus
setup:
- tool: edit_file
  args:
    path: server.properties
    old_text: view-distance=10
    new_text: view-distance=8
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: any_of
  checks:
  - type: file_regex
    path: /data/server.properties
    pattern: (?m)^difficulty=peaceful$
    present: true
  - type: tool_regex
    tool: send_command
    args:
      command: difficulty
    pattern: (?i)peaceful
    present: true
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^motd=Brewhaus$
  present: true
