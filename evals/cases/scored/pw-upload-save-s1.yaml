id: pw-upload-save-s1
scenario: pw-upload-save
split: scored
game: palworld
kind: world
task_area: config
prompt: we've got a palworld save from our old host that I dropped on the server files. can you get the server running that one
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- pod_put:
    src: evals/fixtures/palworld/world.tgz
    dst: /tmp/world.tgz
- pod_exec: bash -c 'mkdir -p /palworld/Pal/Saved/SaveGames/0/7E3F9A12B4C85D60E1F2A3B4C5D6E7F8 && tar -xzf /tmp/world.tgz -C /palworld/Pal/Saved/SaveGames/0/7E3F9A12B4C85D60E1F2A3B4C5D6E7F8 --strip-components=1 && chown -R steam:steam /palworld/Pal/Saved/SaveGames/0/7E3F9A12B4C85D60E1F2A3B4C5D6E7F8'
- pod_exec: test -f /palworld/Pal/Saved/SaveGames/0/7E3F9A12B4C85D60E1F2A3B4C5D6E7F8/Level.sav
- pod_exec: bash -c '! grep -q DedicatedServerName=7E3F9A12B4C85D60E1F2A3B4C5D6E7F8 /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini'
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini
  pattern: (?m)^DedicatedServerName=7E3F9A12B4C85D60E1F2A3B4C5D6E7F8$
  present: true
- type: pod_exec
  cmd: test -f /palworld/Pal/Saved/SaveGames/0/7E3F9A12B4C85D60E1F2A3B4C5D6E7F8/Level.sav
  expect_exit: 0
