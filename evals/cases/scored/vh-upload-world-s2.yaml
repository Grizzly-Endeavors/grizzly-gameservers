id: vh-upload-world-s2
scenario: vh-upload-world
split: scored
game: valheim
kind: world
task_area: config
prompt: uploaded my Ironvale world earlier but the server still seems to be some new empty map. switch it over to Ironvale pls
setup:
- pod_put:
    src: evals/fixtures/valheim/Ironvale.tgz
    dst: /config/Ironvale.tgz
- pod_exec: sh -c 'cd /config/worlds_local && tar -xzf /config/Ironvale.tgz && rm /config/Ironvale.tgz'
- pod_exec: sh -c 'test -f /config/worlds_local/Ironvale/_main.7.db2'
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[-]world Ironvale "'
  expect_exit: 0
