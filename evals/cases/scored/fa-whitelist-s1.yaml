id: fa-whitelist-s1
scenario: fa-whitelist
split: scored
game: factorio
kind: access
task_area: config
prompt: lock the server down so just Linus, Margaret and Dennis can join
setup:
- wait: ready
  timeout_s: 300
checks:
- type: ready
- type: file_regex
  path: /factorio/config/server-whitelist.json
  pattern: '"(?i:Linus)"'
  present: true
- type: file_regex
  path: /factorio/config/server-whitelist.json
  pattern: '"(?i:Margaret)"'
  present: true
- type: file_regex
  path: /factorio/config/server-whitelist.json
  pattern: '"(?i:Dennis)"'
  present: true
- type: pod_exec
  cmd: sh -c 'test "$(jq length /factorio/config/server-whitelist.json)" = 3'
  expect_exit: 0
