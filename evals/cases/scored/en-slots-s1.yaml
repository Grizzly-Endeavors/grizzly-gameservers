id: en-slots-s1
scenario: en-slots
split: scored
game: enshrouded
kind: config
task_area: config
prompt: we need 12 slots
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-slots-s1.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e --argjson b 8 '.slotCount==$b' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --argjson n 12 '.slotCount==$n' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
