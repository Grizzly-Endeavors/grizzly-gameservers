id: vh-install-mod-s1
scenario: vh-install-mod
split: scored
game: valheim
kind: mods
task_area: config
prompt: could you put plant everything on the server? we want to plant way more stuff around the base
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'OdinPlus-Basements-2.0.1

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^Advize-PlantEverything-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^OdinPlus-Basements-
  present: true
