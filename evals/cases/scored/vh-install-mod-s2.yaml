id: vh-install-mod-s2
scenario: vh-install-mod
split: scored
game: valheim
kind: mods
task_area: config
prompt: we'd like the adventure backpacks mod on our server, thanks
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'Advize-PlantEverything-1.21.4

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^Vapok-AdventureBackpacks-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^ValheimModding-Jotunn-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^ValheimModding-YamlDotNet-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^Advize-PlantEverything-
  present: true
