id: mc-access-s2
scenario: mc-access
split: scored
game: minecraft
kind: access
task_area: config
prompt: my cousin Quillon_7 wants to join us, let him in
setup:
- tool: edit_file
  args:
    path: server.properties
    old_text: online-mode=true
    new_text: online-mode=false
- tool: edit_file
  args:
    path: server.properties
    old_text: white-list=false
    new_text: white-list=true
- tool: edit_file
  args:
    path: server.properties
    old_text: enforce-whitelist=false
    new_text: enforce-whitelist=true
- tool: write_file
  args:
    path: whitelist.json
    content: "[\n  {\n    \"uuid\": \"497f7c4f-9c5f-36bf-9d00-c3ee8abadda8\",\n    \"name\": \"Halvard\"\n  },\n  {\n    \"uuid\": \"307248be-94dd-37ac-8e2b-0f1eec0063ff\",\n    \"name\": \"Juniper_B\"\n\
      \  }\n]\n"
- tool: write_file
  args:
    path: ops.json
    content: "[\n  {\n    \"uuid\": \"7f3f6026-79d2-3939-9641-ee7c1fe32214\",\n    \"name\": \"Tobias_K\",\n    \"level\": 4,\n    \"bypassesPlayerLimit\": false\n  }\n]\n"
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"Quillon_7"
  present: true
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^white-list=true$
  present: true
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"Halvard"
  present: true
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"Juniper_B"
  present: true
