id: tr-config-broken-s2
scenario: tr-config-broken
split: scored
game: terraria
kind: fix
task_area: troubleshooting
prompt: we turned pvp on in the settings file last night and ever since the server seems off
setup:
- pod_exec: 'sed -i -E ''s/("PvPMode": )"normal"/\1"always/'' /data/config/config.json'
- restart: true
- wait: log
  pattern: Server started
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: jq -e type /data/config/config.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e .Settings.RestApiEnabled==true /data/config/config.json
  expect_exit: 0
- type: json_equals
  path: /data/config/config.json
  key: Settings.PvPMode
  equals: always
