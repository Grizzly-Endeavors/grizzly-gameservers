id: mc-install-mod-s5
scenario: mc-install-mod
split: scored
game: minecraft
kind: mods
task_area: config
prompt: can we get Ksyxis? my brother says it makes the server boot faster
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MODRINTH_PROJECTS=ferrite-core,lithium

      MODRINTH_DOWNLOAD_DEPENDENCIES=required

      '
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "ksyxis"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "ferrite[-]?core"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "lithium"'
  expect_exit: 0
