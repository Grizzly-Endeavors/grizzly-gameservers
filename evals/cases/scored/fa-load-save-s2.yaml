id: fa-load-save-s2
scenario: fa-load-save
split: scored
game: factorio
kind: world
task_area: config
prompt: the server is running a fresh map but i uploaded nauvis-rebirth.zip earlier. please switch to that save
setup:
- pod_put:
    src: evals/fixtures/factorio/singleplayer-save.zip
    dst: /factorio/saves/nauvis-rebirth.zip
- pod_exec: sh -c 'chown factorio:factorio /factorio/saves/nauvis-rebirth.zip && touch -d "2026-09-01 10:00:00" /factorio/saves/nauvis-rebirth.zip'
- restart: true
- wait: log
  pattern: Loading map /factorio/saves/_autosave
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: grep -q 'Loading map /factorio/saves/nauvis-rebirth.zip' /factorio/factorio-current.log
  expect_exit: 0
