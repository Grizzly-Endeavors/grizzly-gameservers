id: vh-install-mod-s3
scenario: vh-install-mod
split: scored
game: valheim
kind: mods
task_area: config
prompt: portals take forever with our group. can you install the quick teleport mod
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'OdinPlus-Basements-2.0.1

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^OdinPlus-QuickTeleport-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^OdinPlus-Basements-
  present: true
