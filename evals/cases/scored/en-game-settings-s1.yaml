id: en-game-settings-s1
scenario: en-game-settings
split: scored
game: enshrouded
kind: config
task_area: config
prompt: can we get double the resources when we mine and chop stuff
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-game-settings-s1.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e '.gameSettingsPreset=="Relaxed" and .gameSettings.resourceDropStackAmountFactor' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e '.gameSettingsPreset=="Custom" and .gameSettings.resourceDropStackAmountFactor==2' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
