id: vh-admin-s1
scenario: vh-admin
split: scored
game: valheim
kind: access
task_area: config
prompt: can you give my wife admin rights on the server? her steam id is 76561198087654321
setup:
- tool: write_file
  args:
    path: adminlist.txt
    content: '// List admin players ID  ONE per line

      76561198000000002

      '
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/adminlist.txt
  pattern: (?m)^76561198087654321\s*$
  present: true
