id: vh-mods-after-update-s2
scenario: vh-mods-after-update
split: scored
game: valheim
kind: fix
task_area: troubleshooting
prompt: everyone got kicked at the login screen with a version mismatch message after valheim updated, can you get us back on?
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'Vapok-AdventureBackpacks-1.9.12

      OdinPlus-QuickTeleport-1.1.0

      OdinPlus-Basements-1.4.0

      '
- restart: true
- wait: ready
  timeout_s: 600
- pod_exec: sh -c 'grep -q "^Vapok-AdventureBackpacks-1.9.12$" /config/.grizzly/thunderstore/resolved'
- pod_exec: sh -c 'grep -q "^OdinPlus-QuickTeleport-1.1.0$" /config/.grizzly/thunderstore/resolved'
- pod_exec: sh -c 'grep -q "^OdinPlus-Basements-1.4.0$" /config/.grizzly/thunderstore/resolved'
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Vapok-AdventureBackpacks-1\.9\.12$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Vapok-AdventureBackpacks-\S+$
  present: true
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-QuickTeleport-1\.1\.0$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-QuickTeleport-\S+$
  present: true
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-Basements-1\.4\.0$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-Basements-\S+$
  present: true
