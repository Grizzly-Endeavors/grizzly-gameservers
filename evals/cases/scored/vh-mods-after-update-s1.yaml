id: vh-mods-after-update-s1
scenario: vh-mods-after-update
split: scored
game: valheim
kind: fix
task_area: troubleshooting
prompt: after the game patch yesterday none of us can connect anymore. says incompatible version when we try to join
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'OdinPlus-Basements-1.4.1

      Advize-PlantEverything-1.19.1

      '
- restart: true
- wait: ready
  timeout_s: 600
- pod_exec: sh -c 'grep -q "^OdinPlus-Basements-1.4.1$" /config/.grizzly/thunderstore/resolved'
- pod_exec: sh -c 'grep -q "^Advize-PlantEverything-1.19.1$" /config/.grizzly/thunderstore/resolved'
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-Basements-1\.4\.1$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-Basements-\S+$
  present: true
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Advize-PlantEverything-1\.19\.1$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Advize-PlantEverything-\S+$
  present: true
