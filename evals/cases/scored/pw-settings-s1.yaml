id: pw-settings-s1
scenario: pw-settings
split: scored
game: palworld
kind: config
task_area: config
prompt: pals keep breaking out of the balls, can you make them easier to catch
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- tool: stop_server
  args: {}
- pod_put:
    src: evals/fixtures/palworld/pw-settings-s1.ini
    dst: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
- tool: start_server
  args: {}
- pod_exec: bash /tmp/wait_rcon_open.sh
- pod_exec: grep -q -E 'PalCaptureRate=1.000000' /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
  pattern: (?m)^OptionSettings=\(.*[(,]PalCaptureRate=(?:[2-9][0-9.]*|1\.0*[1-9][0-9]*)[,)]
  present: true
