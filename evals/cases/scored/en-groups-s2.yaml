id: en-groups-s2
scenario: en-groups
split: scored
game: enshrouded
kind: access
task_area: config
prompt: guests shouldn't be able to break stuff in our base, only look around and chat. can you lock that down
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-groups-s2.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e --arg n Guest '.userGroups | any(.name==$n and .canEditWorld==true and .canEditBase==true)' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg n Guest '.userGroups | any(.name==$n and .canEditWorld==false and .canEditBase==false and .canKickBan==false)' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --arg n Guest --arg p visit2024 '.userGroups | any(.name==$n and .password==$p)' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
