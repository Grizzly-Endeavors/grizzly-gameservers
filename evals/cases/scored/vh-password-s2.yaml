id: vh-password-s2
scenario: vh-password
split: scored
game: valheim
kind: fix
task_area: troubleshooting
prompt: valheim server is showing offline since i swapped the join password for something easier. can you fix it
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_PASS=bear

      '
- restart: true
- wait: log
  pattern: bad password
  timeout_s: 300
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^SERVER_PASS=\S{5,}$
  present: true
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[v]alheim_server"'
  expect_exit: 0
