id: pw-player-cap-s2
scenario: pw-player-cap
split: scored
game: palworld
kind: config
task_area: config
prompt: can you change the max players to 12? it's capped too low for movie night
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- tool: stop_server
  args: {}
- pod_put:
    src: evals/fixtures/palworld/pw-player-cap-s2.ini
    dst: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
- tool: start_server
  args: {}
- pod_exec: bash /tmp/wait_rcon_open.sh
- pod_exec: grep -q -E 'ServerPlayerMaxNum=4' /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
  pattern: (?m)^OptionSettings=\(.*[(,]ServerPlayerMaxNum=12[,)]
  present: true
