id: mc-mod-missing-dependency-s4
scenario: mc-mod-missing-dependency
split: scored
game: minecraft
kind: fix
task_area: troubleshooting
prompt: Mod Menu was added to the server yesterday and since then it won't boot. we want to keep it, just get it working
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MODRINTH_PROJECTS=spark,krypton,modmenu

      '
- restart: true
- wait: log
  pattern: requires any version of fabric-api
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "modmenu|mod-menu"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "fabric-api"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "krypton"'
  expect_exit: 0
