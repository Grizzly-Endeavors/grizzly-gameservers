id: pw-upload-save-s2
scenario: pw-upload-save
split: scored
game: palworld
kind: world
task_area: config
prompt: my buddy sent me his world and I copied the folder over, how do we play on that instead of the new one
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- pod_put:
    src: evals/fixtures/palworld/world.tgz
    dst: /tmp/world.tgz
- pod_exec: bash -c 'mkdir -p /palworld/Pal/Saved/SaveGames/0/0F1E2D3C4B5A69788796A5B4C3D2E1F0 && tar -xzf /tmp/world.tgz -C /palworld/Pal/Saved/SaveGames/0/0F1E2D3C4B5A69788796A5B4C3D2E1F0 --strip-components=1 && chown -R steam:steam /palworld/Pal/Saved/SaveGames/0/0F1E2D3C4B5A69788796A5B4C3D2E1F0'
- pod_exec: test -f /palworld/Pal/Saved/SaveGames/0/0F1E2D3C4B5A69788796A5B4C3D2E1F0/Level.sav
- pod_exec: bash -c '! grep -q DedicatedServerName=0F1E2D3C4B5A69788796A5B4C3D2E1F0 /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini'
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini
  pattern: (?m)^DedicatedServerName=0F1E2D3C4B5A69788796A5B4C3D2E1F0$
  present: true
- type: pod_exec
  cmd: test -f /palworld/Pal/Saved/SaveGames/0/0F1E2D3C4B5A69788796A5B4C3D2E1F0/Level.sav
  expect_exit: 0
