id: tr-stuck-starting-s2
scenario: tr-stuck-starting
split: scored
game: terraria
kind: fix
task_area: troubleshooting
prompt: terraria is stuck on starting. I restarted it twice already and no luck
setup:
- tool: write_file
  args:
    path: config/serverconfig.txt
    content: 'world=/data/worlds/grizzly

      worldname=Grizzly

      difficulty=0

      maxplayers=8

      port=7777

      password=

      '
- restart: true
- wait: log
  pattern: Could not find file
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/config/serverconfig.txt
  pattern: (?m)^world=/data/worlds/grizzly\.wld\s*$
  present: true
- type: pod_exec
  cmd: sh -c 'test -s /data/worlds/grizzly.wld'
  expect_exit: 0
