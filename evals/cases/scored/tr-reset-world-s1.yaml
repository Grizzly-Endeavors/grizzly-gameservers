id: tr-reset-world-s1
scenario: tr-reset-world
split: scored
game: terraria
kind: world
task_area: config
prompt: new world on expert please. don't delete the one we have
setup:
- pod_put:
    src: evals/fixtures/terraria/small-world.wld
    dst: /data/worlds/Hearthstone.wld
- tool: write_file
  args:
    path: config/serverconfig.txt
    content: 'world=/data/worlds/Hearthstone.wld

      worldname=Grizzly

      difficulty=0

      maxplayers=8

      port=7777

      password=

      '
- restart: true
- wait: log
  pattern: Server started
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/config/serverconfig.txt
  pattern: (?m)^world=(?!.*Hearthstone\.wld).*\.wld\s*$
  present: true
- type: pod_exec
  cmd: sh -c 'test -s /data/worlds/Hearthstone.wld'
  expect_exit: 0
- type: any_of
  checks:
  - type: file_regex
    path: /data/config/serverconfig.txt
    pattern: (?m)^difficulty=1\s*$
    present: true
  - type: file_regex
    path: /data/config/serverconfig.txt
    pattern: (?im)^difficulty=expert\s*$
    present: true
