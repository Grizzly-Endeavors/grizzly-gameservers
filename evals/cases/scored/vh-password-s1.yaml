id: vh-password-s1
scenario: vh-password
split: scored
game: valheim
kind: fix
task_area: troubleshooting
prompt: set a new password on the server last night so my brother could remember it. now nobody can get on at all. help?
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_PASS=1234

      '
- restart: true
- wait: log
  pattern: bad password
  timeout_s: 300
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^SERVER_PASS=\S{5,}$
  present: true
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[v]alheim_server"'
  expect_exit: 0
