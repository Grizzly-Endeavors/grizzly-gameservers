id: fa-whitelist-s2
scenario: fa-whitelist
split: scored
game: factorio
kind: access
task_area: config
prompt: 'whitelist only these two people: Hopper and Turing'
setup:
- wait: ready
  timeout_s: 300
checks:
- type: ready
- type: file_regex
  path: /factorio/config/server-whitelist.json
  pattern: '"(?i:Hopper)"'
  present: true
- type: file_regex
  path: /factorio/config/server-whitelist.json
  pattern: '"(?i:Turing)"'
  present: true
- type: pod_exec
  cmd: sh -c 'test "$(jq length /factorio/config/server-whitelist.json)" = 2'
  expect_exit: 0
