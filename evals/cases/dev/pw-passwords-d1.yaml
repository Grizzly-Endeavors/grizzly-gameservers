id: pw-passwords-d1
scenario: pw-passwords
split: dev
game: palworld
kind: access
task_area: config
prompt: can we put a password on the server so random people cant join? make it blueberry42
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- tool: stop_server
  args: {}
- pod_put:
    src: evals/fixtures/palworld/pw-passwords-d1.ini
    dst: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
- tool: start_server
  args: {}
- pod_exec: bash /tmp/wait_rcon_open.sh
- pod_exec: grep -q -E 'ServerPassword=""' /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
  pattern: (?m)^OptionSettings=\(.*[(,]ServerPassword="blueberry42"[,)]
  present: true
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
  pattern: AdminPassword="blueberry42"
  present: false
