id: mc-heap-d1
scenario: mc-heap
split: dev
game: minecraft
kind: fix
task_area: troubleshooting
prompt: it says something about out of memory and then the server dies right at startup, can you fix it? we want to keep our mods
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MEMORY=128M

      MODRINTH_PROJECTS=lithium,ferrite-core,spark,chunky,krypton

      MODRINTH_DOWNLOAD_DEPENDENCIES=required

      '
- restart: true
- wait: log
  pattern: OutOfMemoryError
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'x=$(ps -eo args | grep -o "Xmx[0-9]*[MG]" | head -1 | sed s/Xmx//); n=${x%?}; u=${x#$n}; [ "$u" = G ] && n=$((n*1024)); [ -n "$n" ] && [ $n -ge 512 ] && [ $n -le 4096 ]'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "lithium"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "chunky"'
  expect_exit: 0
