id: pw-upload-save-d1
scenario: pw-upload-save
split: dev
game: palworld
kind: world
task_area: config
prompt: I uploaded our co-op world into the saves, can the server use it
setup:
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_open.sh
    dst: /tmp/wait_rcon_open.sh
- pod_put:
    src: evals/fixtures/palworld/wait_rcon_closed.sh
    dst: /tmp/wait_rcon_closed.sh
- pod_put:
    src: evals/fixtures/palworld/world.tgz
    dst: /tmp/world.tgz
- pod_exec: bash -c 'mkdir -p /palworld/Pal/Saved/SaveGames/0/A1B2C3D4E5F60718293A4B5C6D7E8F90 && tar -xzf /tmp/world.tgz -C /palworld/Pal/Saved/SaveGames/0/A1B2C3D4E5F60718293A4B5C6D7E8F90 --strip-components=1 && chown -R steam:steam /palworld/Pal/Saved/SaveGames/0/A1B2C3D4E5F60718293A4B5C6D7E8F90'
- pod_exec: test -f /palworld/Pal/Saved/SaveGames/0/A1B2C3D4E5F60718293A4B5C6D7E8F90/Level.sav
- pod_exec: bash -c '! grep -q DedicatedServerName=A1B2C3D4E5F60718293A4B5C6D7E8F90 /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini'
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_rcon_open.sh
  expect_exit: 0
- type: file_regex
  path: /palworld/Pal/Saved/Config/LinuxServer/GameUserSettings.ini
  pattern: (?m)^DedicatedServerName=A1B2C3D4E5F60718293A4B5C6D7E8F90$
  present: true
- type: pod_exec
  cmd: test -f /palworld/Pal/Saved/SaveGames/0/A1B2C3D4E5F60718293A4B5C6D7E8F90/Level.sav
  expect_exit: 0
