id: vh-settings-d1
scenario: vh-settings
split: dev
game: valheim
kind: config
task_area: config
prompt: turn on crossplay so my xbox friend can get on our server
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_NAME=Grizzly Valheim

      CROSSPLAY=0

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^CROSSPLAY=(1|true)$
  present: true
