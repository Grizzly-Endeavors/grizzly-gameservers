id: vh-install-mod-d1
scenario: vh-install-mod
split: dev
game: valheim
kind: mods
task_area: config
prompt: can you add a basement mod to the server? we want to dig under our base
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'Advize-PlantEverything-1.21.4

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^OdinPlus-Basements-
  present: true
- type: file_regex
  path: /config/.grizzly/thunderstore/resolved
  pattern: (?m)^Advize-PlantEverything-
  present: true
