id: mc-access-d1
scenario: mc-access
split: dev
game: minecraft
kind: access
task_area: config
prompt: add Bramblewick to the whitelist please
setup:
- tool: edit_file
  args:
    path: server.properties
    old_text: online-mode=true
    new_text: online-mode=false
- tool: edit_file
  args:
    path: server.properties
    old_text: white-list=false
    new_text: white-list=true
- tool: edit_file
  args:
    path: server.properties
    old_text: enforce-whitelist=false
    new_text: enforce-whitelist=true
- tool: write_file
  args:
    path: whitelist.json
    content: "[\n  {\n    \"uuid\": \"c3f5fa4b-556e-376d-b8aa-a5812a9b56e7\",\n    \"name\": \"Tilly_Marsh\"\n  },\n  {\n    \"uuid\": \"033fffc2-409d-3c64-9292-d4ce9801bd25\",\n    \"name\": \"okonkwo77\"\
      \n  }\n]\n"
- tool: write_file
  args:
    path: ops.json
    content: "[\n  {\n    \"uuid\": \"7949cdae-78e9-3cfd-a603-9fc4ae82a488\",\n    \"name\": \"Pip\",\n    \"level\": 4,\n    \"bypassesPlayerLimit\": false\n  }\n]\n"
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"Bramblewick"
  present: true
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^white-list=true$
  present: true
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"Tilly_Marsh"
  present: true
- type: file_regex
  path: /data/whitelist.json
  pattern: (?i)"name":\s*"okonkwo77"
  present: true
