id: mc-properties-d1
scenario: mc-properties
split: dev
game: minecraft
kind: config
task_area: config
prompt: can we make it hard mode and let 12 people on
setup:
- tool: edit_file
  args:
    path: server.properties
    old_text: max-players=20
    new_text: max-players=5
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: file_regex
  path: /data/server.properties
  pattern: (?m)^max-players=12$
  present: true
- type: any_of
  checks:
  - type: file_regex
    path: /data/server.properties
    pattern: (?m)^difficulty=hard$
    present: true
  - type: tool_regex
    tool: send_command
    args:
      command: difficulty
    pattern: (?i)hard
    present: true
