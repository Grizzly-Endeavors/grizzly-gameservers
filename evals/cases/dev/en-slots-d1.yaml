id: en-slots-d1
scenario: en-slots
split: dev
game: enshrouded
kind: config
task_area: config
prompt: how do I let 10 people join at once? right now my friends get a full server message
setup:
- pod_put:
    src: evals/fixtures/enshrouded/wait_server_up.sh
    dst: /tmp/wait_server_up.sh
- pod_put:
    src: evals/fixtures/enshrouded/en-slots-d1.json
    dst: /home/steam/enshrouded/enshrouded_server.json
- pod_exec: jq -e --argjson b 6 '.slotCount==$b' /home/steam/enshrouded/enshrouded_server.json
checks:
- type: ready
- type: pod_exec
  cmd: bash /tmp/wait_server_up.sh
  expect_exit: 0
- type: pod_exec
  cmd: jq -e --argjson n 10 '.slotCount==$n' /home/steam/enshrouded/enshrouded_server.json
  expect_exit: 0
