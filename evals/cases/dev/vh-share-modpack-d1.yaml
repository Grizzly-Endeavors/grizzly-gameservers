id: vh-share-modpack-d1
scenario: vh-share-modpack
split: dev
game: valheim
kind: mods
task_area: config
prompt: my friend wants to join our valheim server but his game complains about mods. what does he need to install?
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'Advize-PlantEverything-1.21.4

      OdinPlus-Basements-2.0.1

      '
- restart: true
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: reply_regex
  pattern: (?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b
