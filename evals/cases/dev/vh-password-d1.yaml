id: vh-password-d1
scenario: vh-password
split: dev
game: valheim
kind: fix
task_area: troubleshooting
prompt: i changed the password on our valheim server and now it won't come up anymore, can you sort it?
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'SERVER_PASS=moo

      '
- restart: true
- wait: log
  pattern: bad password
  timeout_s: 300
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/env
  pattern: (?m)^SERVER_PASS=\S{5,}$
  present: true
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[v]alheim_server"'
  expect_exit: 0
