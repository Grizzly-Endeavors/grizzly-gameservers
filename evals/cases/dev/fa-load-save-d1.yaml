id: fa-load-save-d1
scenario: fa-load-save
split: dev
game: factorio
kind: world
task_area: config
prompt: I uploaded my singleplayer save megabase.zip, can you load that one on the server?
setup:
- pod_put:
    src: evals/fixtures/factorio/singleplayer-save.zip
    dst: /factorio/saves/megabase.zip
- pod_exec: sh -c 'chown factorio:factorio /factorio/saves/megabase.zip && touch -d "2026-09-01 10:00:00" /factorio/saves/megabase.zip'
- restart: true
- wait: log
  pattern: Loading map /factorio/saves/_autosave
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: grep -q 'Loading map /factorio/saves/megabase.zip' /factorio/factorio-current.log
  expect_exit: 0
