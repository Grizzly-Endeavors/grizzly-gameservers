id: vh-mods-after-update-d1
scenario: vh-mods-after-update
split: dev
game: valheim
kind: fix
task_area: troubleshooting
prompt: valheim updated and now nobody can join, it says our version doesn't match the server
setup:
- tool: write_file
  args:
    path: .grizzly/mods
    content: 'Advize-PlantEverything-1.20.0

      Vapok-AdventureBackpacks-1.9.13

      OdinPlus-QuickTeleport-1.1.0

      '
- restart: true
- wait: ready
  timeout_s: 600
- pod_exec: sh -c 'grep -q "^Advize-PlantEverything-1.20.0$" /config/.grizzly/thunderstore/resolved'
- pod_exec: sh -c 'grep -q "^Vapok-AdventureBackpacks-1.9.13$" /config/.grizzly/thunderstore/resolved'
- pod_exec: sh -c 'grep -q "^OdinPlus-QuickTeleport-1.1.0$" /config/.grizzly/thunderstore/resolved'
checks:
- type: ready
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Advize-PlantEverything-1\.20\.0$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Advize-PlantEverything-\S+$
  present: true
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Vapok-AdventureBackpacks-1\.9\.13$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^Vapok-AdventureBackpacks-\S+$
  present: true
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-QuickTeleport-1\.1\.0$
  present: false
- type: file_regex
  path: /config/.grizzly/mods
  pattern: (?m)^OdinPlus-QuickTeleport-\S+$
  present: true
