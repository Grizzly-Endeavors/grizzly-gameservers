id: vh-upload-world-d1
scenario: vh-upload-world
split: dev
game: valheim
kind: world
task_area: config
prompt: I put my singleplayer world Dragonholm onto the server, can we play that one instead of the fresh world?
setup:
- pod_put:
    src: evals/fixtures/valheim/Dragonholm.tgz
    dst: /config/Dragonholm.tgz
- pod_exec: sh -c 'cd /config/worlds_local && tar -xzf /config/Dragonholm.tgz && rm /config/Dragonholm.tgz'
- pod_exec: sh -c 'test -f /config/worlds_local/Dragonholm/_main.7.db2'
- wait: ready
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ps -eo args | grep -q "[-]world Dragonholm "'
  expect_exit: 0
