id: mc-crash-bisect-d1
scenario: mc-crash-bisect
split: dev
game: minecraft
kind: fix
task_area: troubleshooting
prompt: we added a bunch of mods tonight and now it crashes on boot, please get us back up and keep the ones that work
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MODRINTH_PROJECTS=lithium,ferrite-core,spark,chunky,krypton,search-on-mcmod

      MODRINTH_DOWNLOAD_DEPENDENCIES=required

      '
- restart: true
- wait: log
  pattern: 'NoClassDefFoundError: net/minecraft/client'
  timeout_s: 300
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "lithium"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "ferritecore|ferrite-core"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "spark"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "chunky"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "krypton"'
  expect_exit: 0
