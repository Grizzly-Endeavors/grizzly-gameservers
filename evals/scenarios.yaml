    examples: ["I uploaded my single player world, make the server use it"]
    checks: [server loads the uploaded world, prior saves backed up, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: en-slots
    game: enshrouded
    kind: config
    source: https://xgamingserver.com/blog/enshrouded-server-config-json-settings-explained/
    staging: healthy server
    examples: ["we need 12 slots"]
    checks: [slotCount set, server Ready]
    variants: 4
    split: { dev: 1, scored: 3 }
