    variants: 3
    split: { dev: 1, scored: 2 }

  - id: tr-reset-world
    game: terraria
    kind: world
    source: https://shockbyte.com/billing/knowledgebase/314/How-to-Change-the-Size-of-your-Terraria-Server-World.html
    staging: healthy small world
    examples: ["can we get a fresh large world, keep the old one though", "new world on expert"]
    checks: [new world at requested size/difficulty is active, old .wld untouched, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: tr-stuck-starting
    game: terraria
    kind: fix
    source: https://shockbyte.com/billing/knowledgebase/305/How-to-Use-a-Custom-World-on-your-Terraria-Server.html
    staging: world= points at a missing file with autocreate off — the server sits at the interactive world picker
    examples: ["server has said 'starting' for 20 minutes"]
    checks: [world= points at the existing world, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: tr-config-broken
    game: terraria
    kind: fix
    source: https://shockbyte.com/billing/knowledgebase/309/How-to-Install-and-Setup-TShock-on-Your-Terraria-Server.html
    staging: TShock config.json made invalid (trailing comma / truncated)
    examples: ["it was working until I changed a setting"]
    checks: [config.json parses, prior settings preserved, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: tr-settings
    game: terraria
    kind: config
    source: https://shockbyte.com/help/knowledgebase/categories/terraria
    staging: healthy server
    examples: ["password it: hunter22", "16 players max", "turn on the whitelist and add my IP"]
    checks: [target setting applied, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: tr-admin
    game: terraria
    kind: access
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-add-a-new-admin-user-on-your-tshock-terraria-server
    reach: verify   # Terraria has no console the supervisor speaks; TShock groups live in its sqlite
    staging: TShock user account exists in the default group
    examples: ["make Quillon an admin"]
    checks: [user in the admin group, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

