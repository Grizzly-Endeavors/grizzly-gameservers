  - id: fa-admins
    game: factorio
    kind: access
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-add-an-admin-on-your-factorio-server
    staging: server-adminlist.json with one entry
    examples: ["make TinkerTom an admin"]
    checks: [name in server-adminlist.json (or promoted over RCON and persisted)]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: fa-whitelist
    game: factorio
    kind: access
    source: https://shockbyte.com/billing/knowledgebase/439/How-to-Whitelist-Players-on-Your-Factorio-Server.html
    staging: no whitelist
    examples: ["only let me, Ada and Grace in"]
    checks: [whitelist enforced with exactly those names, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: fa-server-settings
    game: factorio
    kind: config
    source: https://shockbyte.com/billing/knowledgebase/437/How-to-Customize-Your-Factorio-Server-Details.html
    staging: customised server-settings.json
    examples: ["put a password on it", "autosave every 5 minutes", "kick people who are afk for 10 min"]
    checks: [target key set, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: fa-keep-running
    game: factorio
    kind: config
    source: https://shockbyte.com/billing/knowledgebase/433/How-to-Keep-Your-Server-Running-with-0-Active-Players.html
    staging: auto_pause on
    examples: ["the factory stops when nobody's on, keep it running"]
    checks: [auto_pause false, server Ready]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: fa-load-save
    game: factorio
    kind: world
    source: https://shockbyte.com/help/knowledgebase/categories/factorio
    reach: verify   # the image loads the newest save; choosing one may need SAVE_NAME on an overlay
    staging: an uploaded single-player save .zip beside the current save
    examples: ["I uploaded my singleplayer save 'megabase.zip', load it"]
    checks: [server running the uploaded save, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: fa-space-age
    game: factorio
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/categories/factorio
    staging: a save made with Space Age; mod-list.json has space-age/quality/elevated-rails disabled
    examples: ["the server won't load our save, says something about space age"]
    checks: [the three expansion mods enabled, save loads, server Ready]
    variants: 4
    split: { dev: 1, scored: 3 }

  - id: fa-disable-mod
    game: factorio
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/categories/factorio
    staging: mod-list.json enables a mod that fails at startup
    examples: ["crashed after we turned on a mod"]
    checks: [server Ready with the customer's other mods still enabled]
    variants: 4
    split: { dev: 1, scored: 3 }

  # ═══════════════ Palworld — 14 scored ═══════════════

  - id: pw-settings
    game: palworld
    kind: config
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-configure-your-palworld-server
    staging: >-
      PalWorldSettings.ini present (single OptionSettings line); values are
      case-sensitive and the server rewrites the file on shutdown
    examples: ["double the exp rate", "make pals easier to catch", "turn off raids", "drop nothing on death"]
    checks: [target value in effect after restart (ini survives shutdown), server Ready]
    variants: 7
    split: { dev: 1, scored: 6 }

  - id: pw-settings-ignored
    game: palworld
    kind: fix
    source: https://www.gameserverkings.com/knowledge-base/palworld/world-settings/
    staging: a WorldOption.sav in the world folder overriding the ini
    examples: ["I changed the settings and nothing happened"]
    checks: [requested setting in effect, server Ready]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: pw-settings-reset
    game: palworld
    kind: fix
    source: https://www.gameserverkings.com/knowledge-base/palworld/palworld-configuration-overview/
    staging: OptionSettings line malformed (unbalanced paren / lowercase true) so the server falls back to defaults
    examples: ["all our settings went back to default"]
    checks: [line parses with the customer's intended values, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: pw-passwords
    game: palworld
    kind: access
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-become-an-admin-on-your-palworld-server
    staging: healthy server
    examples: ["make the server private, password trees", "set an admin password so I can use commands"]
    checks: [ServerPassword / AdminPassword set as asked (not swapped), server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

