    game: palworld
    kind: world
    source: https://shockbyte.com/help/knowledgebase/categories/palworld?page=2
    staging: an uploaded world folder under SaveGames; GameUserSettings.ini DedicatedServerName points at the old one
    examples: ["I uploaded our co-op world, can the server use it"]
    checks: [DedicatedServerName matches the uploaded folder, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: pw-player-cap
    game: palworld
    kind: config
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-configure-your-palworld-server
    staging: healthy server
    examples: ["let 20 people on"]
    checks: [player cap set, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  # ═══════════════ Enshrouded (Proton) — 12 scored ═══════════════

  - id: en-groups
    game: enshrouded
    kind: access
    source: https://xgamingserver.com/blog/enshrouded-server-config-json-settings-explained/
    staging: enshrouded_server.json with default userGroups
    examples: ["set a password for friends and a separate admin one for me", "guests shouldn't be able to break stuff"]
    checks: [userGroups passwords/permissions as asked, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: en-game-settings
    game: enshrouded
    kind: config
    source: https://shockbyte.com/billing/knowledgebase/1197/How-to-Configure-your-Enshrouded-Server.html
    staging: preset Default
    examples: ["make enemies hit less hard", "double the resource drops"]
    checks: [gameSettingsPreset Custom and the value set (individual values are ignored otherwise), server Ready]
    variants: 4
    split: { dev: 1, scored: 3 }

  - id: en-config-reset
    game: enshrouded
    kind: fix
    source: https://xgamingserver.com/blog/enshrouded-server-config-json-settings-explained/
    staging: config previously customised, then made invalid JSON — the server resets it to defaults at start
    examples: ["the server name and passwords are all gone"]
