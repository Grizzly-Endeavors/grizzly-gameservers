# Scenario catalog for the Fireworks Deploy eval.
#
# Every scenario is a ticket a host's T1/T2 support has to work: a customer
# asks for a change or reports a broken server, and support must get it done.
# The eval measures completion only — a case passes when the server is Ready
# and the requested end state verifiably holds. Escalating, refusing, or
# explaining instead of doing is a miss.
#
# Each scenario is a template the case generator expands into `variants`.
# `split` assigns whole variants to dev or scored, so a scored case never
# shares staging parameters (mod, value, world name, phrasing) with anything
# tuned against.
#
# source: the host knowledge-base article the ticket type comes from. Shockbyte
#   pages could only be read as search-result titles/snippets (their site
#   403s automated fetches); the URL is the grounding, the quirk is verified in
#   the staging spike.
# reach: verify — the current tool surface may not be able to perform this fix
#   (no allowlisted key or file op for it). The staging spike checks; if no
#   system can do it through the tools, the catalog/allowlist is widened before
#   the freeze (identically for every system) or the scenario is dropped.
#
# Checks assert only what the ticket asks for, stated or plainly implied
# (a crash fix keeps the customer's mods), plus the server coming back Ready
# and the result surviving one more runner-triggered restart. They do not
# grade how the fix was done or what else changed.
#
# Every case also records turns, tokens, cost and time to resolution.

scenarios:

  # ═══════════════ Minecraft (Fabric, itzg) — 20 scored ═══════════════

  - id: mc-install-mod
    game: minecraft
    kind: mods
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-fabric-mods-on-your-minecraft-server
    staging: healthy Fabric server with a few mods
    examples: ["can you add Lithium", "we want the voice chat mod on the server"]
    checks: [mod resolved for this loader+version, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: mc-mod-missing-dependency
    game: minecraft
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/articles/my-minecraft-server-won-t-start
    staging: a mod with a required dependency added; dependency downloads off
    examples: ["server won't start after I added Mod Menu"]
    checks: [requested mod installed and loading, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: mc-crash-bisect
    game: minecraft
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/articles/my-minecraft-server-won-t-start
    staging: a client-only mod hidden among 5-6 good ones; the trace names a client class, not the mod
    examples: ["we added a bunch of mods tonight and now it crashes on boot"]
    checks: [server Ready with the customer's other mods still installed]
    variants: 5
    split: { dev: 1, scored: 4 }

  - id: mc-plugins-on-modded
    game: minecraft
    kind: mods
    source: https://shockbyte.com/billing/knowledgebase/5/Mods-and-Plugins
    reach: verify   # no PLUGINS key on the overlay allowlist
    staging: Fabric server; customer wants a Bukkit plugin
    examples: ["can you install EssentialsX"]
    checks: [server type supports the plugin, plugin loaded, server Ready]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: mc-switch-world
    game: minecraft
    kind: world
    source: https://shockbyte.com/help/knowledgebase/articles/my-minecraft-server-won-t-start
    staging: a second, uploaded world directory beside the active one
    examples: ["I uploaded our old world 'smp-season2', can we play on that instead"]
    checks: [level-name points at the uploaded world, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: mc-upgrade-version
    game: minecraft
    kind: config
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-fabric-mods-on-your-minecraft-server
    staging: server one release behind with mods pinned to that release
    examples: ["update the server to the new version, keep our mods"]
    checks: [VERSION bumped, every mod on a build for the new version, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: mc-heap
    game: minecraft
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/articles/my-minecraft-server-won-t-start
    staging: heap too small for the mod list (OOM at boot), or heap above the pod limit (silent OOM-kill)
    examples: ["it just dies randomly", "out of memory error on startup"]
    checks: [heap and pod limit coherent, server Ready and survives 2 min]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: mc-access
    game: minecraft
    kind: access
    source: common
    staging: whitelist enabled; ops.json with existing entries
    examples: ["add Bramblewick to the whitelist", "make Fenwick an op"]
    checks: [named player added, whitelist still enforced, no entries removed]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: mc-properties
    game: minecraft
    kind: config
    source: common
    staging: customised server.properties
    examples: ["turn off pvp", "20 players and hard mode", "make it so people can't hurt each other"]
    checks: [target keys set, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  # ═══════════════ Valheim (lloesche + BepInEx, Thunderstore) — 16 scored ═══════════════

  - id: vh-password
    game: valheim
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-change-your-valheim-server-password
    staging: >-
      password set to a value that contains the world name, or shorter than 5
      chars — the server refuses to start
    examples: ["changed the password and now the server won't come up"]
    checks: [password ≥5 chars and not containing the world name, server Ready]
    variants: 4
    split: { dev: 1, scored: 3 }

  - id: vh-upload-world
    game: valheim
    kind: world
    source: https://shockbyte.com/billing/knowledgebase/258/How-to-Upload-a-Custom-World-to-Your-Valheim-Server.html
    reach: verify   # world name is not on the overlay allowlist today
    staging: an uploaded .db/.fwl pair under its own name beside the active world
    examples: ["I uploaded my single player world 'Dragonholm', can the server run it"]
    checks: [server loads the uploaded world, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: vh-install-mod
    game: valheim
    kind: mods
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-bepinex-mods-onto-your-valheim-server
    staging: healthy modded server
    examples: ["add PlantEverything", "we want Valheim Plus"]
    checks: [mod in the installed set, its dependencies resolved, server Ready]
    variants: 4
    split: { dev: 1, scored: 3 }

  - id: vh-mods-after-update
    game: valheim
    kind: fix
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-bepinex-mods-onto-your-valheim-server
    staging: mod list pinned to versions that predate the current game build
    examples: ["game updated and now nobody can join, says incompatible version"]
    checks: [pinned mods bumped to current builds, none dropped, server Ready]
    variants: 3
    split: { dev: 1, scored: 2 }

  - id: vh-share-modpack
    game: valheim
    kind: mods
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-bepinex-mods-onto-your-valheim-server
    staging: modded server
    examples: ["my friend can't join, what mods does he need"]
    checks: [reply carries a profile code that resolves to the server's exact mod set]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: vh-import-modpack
    game: valheim
    kind: mods
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-install-bepinex-mods-onto-your-valheim-server
    staging: vanilla-ish server; customer pastes an r2modman profile code
    examples: ["here's our modpack code, put it on the server: <code>"]
    checks: [installed set matches the profile's server-side packages, server Ready]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: vh-admin
    game: valheim
    kind: access
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-use-dev-cheat-commands-on-your-valheim-server
    staging: adminlist.txt with one entry
    examples: ["make me admin, my steam id is 7656119…"]
    checks: [SteamID64 in adminlist.txt, server Ready]
    variants: 2
    split: { dev: 1, scored: 1 }

  - id: vh-settings
    game: valheim
    kind: config
    source: https://shockbyte.com/help/knowledgebase/articles/how-to-change-your-valheim-server-password
    staging: healthy server
    examples: ["rename the server to Mead Hall", "turn on crossplay so my xbox friend can join", "hide it from the server list"]
    checks: [target setting applied, server Ready]
    variants: 5
    split: { dev: 1, scored: 4 }

  # ═══════════════ Terraria (TShock) — 13 scored ═══════════════

  - id: tr-custom-world
    game: terraria
    kind: world
    source: https://shockbyte.com/billing/knowledgebase/305/How-to-Use-a-Custom-World-on-your-Terraria-Server.html
    staging: an uploaded .wld beside the active world
    examples: ["I put my world file 'Corruption Run' in, use that one"]
