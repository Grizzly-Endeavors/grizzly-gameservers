id: mc-install-mod-s1
scenario: mc-install-mod
split: scored
game: minecraft
kind: mods
task_area: config
prompt: we're about to go exploring a ton, can you add that Chunky thing so the map is pre-generated
setup:
- tool: write_file
  args:
    path: .grizzly/env
    content: 'TYPE=FABRIC

      VERSION=26.2

      MODRINTH_PROJECTS=lithium,krypton

      MODRINTH_DOWNLOAD_DEPENDENCIES=required

      '
- restart: true
- wait: log
  pattern: Done \(
  timeout_s: 600
checks:
- type: ready
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "chunky"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "lithium"'
  expect_exit: 0
- type: pod_exec
  cmd: sh -c 'ls /data/mods | grep -qiE "krypton"'
  expect_exit: 0
