# Namespace-wide ceiling behind the bot's per-guild caps (ADR-022): a generous
# backstop that catches a bug in bot-side enforcement, not the policy itself —
# the per-guild math lives in the bot, where a refusal can name its figures for
# a non-technical friend. Sized for ~2 full guild allowances (24c/48Gi each)
# plus the bot's own pod (it runs in this namespace, 2c/2Gi limits) and an
# Agones SDK sidecar per game pod (200m/128Mi, declared via the Agones Helm
# values — a quota on limits.* rejects any new pod whose containers leave them
# undeclared, which is why those declarations must exist before this object).
# A LimitRange stays rejected per ADR-021: it would impose values on the
# sidecar; a quota only requires that declarations exist. Quotas gate only new
# pod admission, so applying or resizing this never disturbs running servers.
#
# CPU and memory are deliberately the binding constraint here, not the PVC
# count: they are what the per-guild caps are denominated in, so a refusal can
# be explained in the same figures a friend was already given. The bot reads
# this object and prices each create against it before leasing anything
# (ADR-027), which is what makes hitting these numbers a clear refusal rather
# than a five-minute wait for a pod that will never be admitted.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: game-servers-guardrail
  namespace: game-servers
spec:
  hard:
    limits.cpu: "56"
    limits.memory: 120Gi
    requests.cpu: "28"
    requests.memory: 64Gi
    # Sized past what CPU/memory can actually host, so the PVC count is never
    # the first wall: at the default 5-server guild cap this is 6 guilds' worth
    # of instances, while the CPU and memory figures above run out at roughly
    # two guilds sitting at their full allowance. Storage is the looser of the
    # two — 32 claims at the largest in the catalog (25Gi) would want 800Gi, so
    # a namespace full of Satisfactory worlds hits the storage figure first and
    # is told so.
    persistentvolumeclaims: "32"
    requests.storage: 600Gi
