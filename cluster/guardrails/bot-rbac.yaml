# The Discord bot's identity and permissions — also the ops agent's ("Gary")
# identity, since Gary runs inside the bot process rather than as a separate
# workload. The bot provisions per-world instances on command
# (create/shutdown/start/restart/destroy), so it can create and delete GameServers,
# their NodePort Services and their PVCs, and read pod IPs to reach the in-pod
# supervisor control API for /stop, warm /start and /restart. It never execs —
# Gary operates a running server entirely through that supervisor HTTP API, not
# through K8s exec — and is namespace-scoped, never cluster-wide.
#
# It holds exactly one mutating verb beyond create/delete: patch on the pods
# `resize` subresource, which is what lets Gary change a running server's CPU and
# memory without disconnecting anyone (ADR-021). That subresource can only alter
# spec.containers[*].resources — not the image, env, volumes, security context,
# or anything else about the pod — so it is a far narrower grant than patch on
# pods. Whole objects are still replaced rather than mutated everywhere else.
#
# It can delete pods, but only to force out one already terminating past its
# grace period: that is the single action that frees an instance stranded on a
# node whose kubelet has stopped answering (see ADR-009). The cluster-scoped
# alternative — tainting the node node.kubernetes.io/out-of-service — is
# deliberately not granted, since it would take this identity outside the
# namespace its whole guardrail design confines it to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discord-bot
  namespace: game-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discord-bot
  namespace: game-servers
rules:
  # List gameservers and read lifecycle state; create/delete them for
  # create/stop/start/destroy. No patch/update — every lifecycle path replaces
  # objects rather than mutating in place.
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "create", "delete"]
  # Resolve NodePorts for addresses, and create/delete the per-instance Service
  # that exposes each world. /stop deliberately retains the Service.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # Per-world persistent storage: created on /create, retained across /stop,
  # deleted only on /destroy.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # Resolve a running instance's pod IP to reach its in-pod supervisor control
  # API for /stop, /start (warm) and /restart. Delete is the reconciler's one
  # lever for a pod stuck terminating on an unresponsive node — Agones won't
  # release the GameServer's finalizer until that pod is gone, so without it a
  # dead node pins a world in place indefinitely. No patch on the pod itself,
  # and still no exec.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # In-place vertical scaling: patch a running game container's CPU/memory with
  # no restart and nobody disconnected (ADR-021). Deliberately the `resize`
  # subresource rather than `pods`, because resize can only touch
  # spec.containers[*].resources — an injected or confused agent cannot reach the
  # image, env, volumes or security context through it. Bot-side clamps bound the
  # values; this bounds the shape.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  # Read actual per-pod CPU/memory from metrics-server for the resource
  # sampler (the cost time series). Read-only and namespace-scoped like
  # everything else here.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read the namespace ceiling so a create can be refused honestly *before* it
  # leases a port and a PVC (ADR-027). Read-only: the quota is the operator's
  # lever and the bot only ever reports it. Without this the bot can't see the
  # ceiling, which degrades to never refusing — admission still holds the line,
  # the friend just gets the worse message.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: discord-bot
  namespace: game-servers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: discord-bot
subjects:
  - kind: ServiceAccount
    name: discord-bot
    namespace: game-servers
