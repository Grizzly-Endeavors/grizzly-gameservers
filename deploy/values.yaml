# Default values for the grizzly-gameservers chart.
# CI bumps the image tag to the gate-signed digest per ADR-020.
image:
  repository: registry.registry.svc.cluster.local:5000/grizzly-gameservers
  # CI (deploy.yml) overwrites `digest` with the gate-signed digest per ADR-020;
  # when set, the chart pins repository@digest (immutable — what cosign signs and
  # Kyverno verifies) and ignores tag/pullPolicy below.
  digest: "sha256:ccd096ab2b9c66f2d1478a9ceb4de4461fbbee52ee373de5931fb71b40fb4665"
  # Dev fallback: a mutable tag pushed by hand (just bot-push). Used only when
  # digest is empty.
  tag: "dev"
  pullPolicy: Always # dev: re-pull the mutable :dev tag on each rollout
# Credentials synced from 1Password via External Secrets Operator. Renders every
# Secret the bot reads into the release namespace — see deploy/README.md for the
# full list and the 1Password paths behind it.
externalSecrets:
  enabled: true
  secretStore: onepassword # ClusterSecretStore provisioned in grizzly-platform
  # OnChange rather than polling: 1Password meters requests per account per
  # day across every service account, so hourly polling would consume the
  # shared ceiling. Rotating a value means touching this ExternalSecret.
  refreshPolicy: OnChange
# Discord bot / ops-agent workload.
bot:
  enabled: true
  replicas: 1
  # The operator allowlist (adminUserIds → cross-guild operators) is NOT set here:
  # the repo is public, and although these ids are not credentials they tie a
  # personal Discord identity to the project. It is synced from 1Password
  # (grizzly-platform/gameservers/discord → admin_user_ids) and injected via
  # secretKeyRef in templates/deployment.yaml. The bot is multi-guild — commands
  # register per-guild on join — so no guild id is pinned. Per-guild admins
  # (roles and users) are configured at runtime with /config, stored in Postgres.
  domain: gameservers.grizzly-endeavors.com # base domain for friend-facing connection addresses
  logLevel: info # RUST_LOG value
  # Ops agent (Gary): the Ollama Cloud model tag. The API key is synced from
  # 1Password into the ollama-api Secret and injected via secretKeyRef (optional —
  # an absent key disables Gary). Override the model here without a rebuild.
  ollamaModel: glm-5.2
  ollamaBaseUrl: "" # override only for a non-default (e.g. self-hosted) endpoint
  # Super-admin web panel (ADR-026). Its own port, its own Service, and its own
  # Ingress: the agent port above must stay reachable by game pods, while this
  # one is reachable only by ingress-nginx — the CiliumNetworkPolicy in
  # cluster/guardrails/bot-ingress.yaml is what enforces that, and it is what
  # makes the panel's trust in Authentik's forward-auth headers sound. Disabled
  # renders none of it and leaves GAMESERVERS_ADMIN_PORT unset, which is how the
  # binary decides not to listen at all.
  adminPanel:
    enabled: true
    host: gameservers-admin.grizzly-endeavors.com
    # Must match DEFAULT_ADMIN_PORT expectations in the CNP below (see issue #42
    # — YAML can't import a Rust const, and a mismatch is a silent Cilium drop).
    port: 9361
    # Authentik group whose members may reach it. Also bound as a policy on the
    # application itself in the grizzly-platform blueprint, so this is the
    # in-app half of a two-layer check.
    requiredGroup: grizzly-admins
  # Foundation Postgres for the bot's durable state (the no-mention home-channel
  # registry). Host/port/name/user are plain config; the password is synced from
  # 1Password into the grizzly-gameservers-db Secret and injected via secretKeyRef
  # (optional — an absent password disables home channels, mentions still work).
  # Provisioned by grizzly-platform's setup-grizzly-gameservers-stores.yml.
  db:
    host: 10.0.0.200 # foundation Postgres on the R730xd (LAN)
    port: 5432
    name: grizzly_gameservers
    user: grizzly_gameservers
  # Foundation kv-cache (Valkey on the R730xd) for Gary's deferred-task queue
  # (run_when). Host/port/db are plain config; the password is synced from 1Password
  # (grizzly-platform/stores/kv-cache) into the grizzly-gameservers-kv-cache Secret
  # and injected via secretKeyRef (optional — an absent password disables the
  # deferred-task feature). Shared instance: DB 2 (0 is the default, 1 is Authentik).
  kv:
    host: 10.0.0.200
    port: 6379
    db: 2
  # S3 (s3-bulk versitygw on the R730xd) for world backups/archives. The access/
  # secret keys come from the grizzly-gameservers-s3 Secret (ESO); absent keys
  # leave the backup feature disabled. Path-style, plain HTTP over the LAN.
  s3:
    endpoint: http://10.0.0.200:7072
    bucket: grizzly-gameservers
    region: us-east-1
  # Approval mail for the beta signup queue, via the platform's Stalwart.
  # The PUBLIC host on purpose even in-cluster: Stalwart trusts PROXY-protocol
  # from 10.0.0.0/8 (which covers the pod network), so a direct in-cluster
  # connection is parsed as a PROXY header and reset. The password is an
  # ExternalSecret (cross-read from platform-stalwart); everything here is plain
  # config. `from` must stay on grizzly-endeavors.com or DMARC alignment fails
  # and the mail is filtered rather than bounced.
  mail:
    host: mail.grizzly-endeavors.com
    port: 587
    user: gary@grizzly-endeavors.com
    from: gary@grizzly-endeavors.com
  # Turn telemetry to the platform's Langfuse. The key pair comes from the
  # grizzly-gameservers-langfuse Secret (ESO); absent keys leave telemetry off.
  # In-cluster and plain HTTP — TLS terminates at the VPS edge, and reaching the
  # public hostname would send every trace through Cloudflare.
  langfuse:
    host: http://langfuse-web.langfuse.svc.cluster.local:3000
  backup:
    intervalHours: 24 # scheduled snapshot cadence for every running server
    retention: 7 # backups kept per server before the cycle prunes older ones
  reconcile:
    intervalMinutes: 5 # how often to sweep for servers stranded on a dead node
    # How long a pod must sit terminating before it counts as stranded. Well
    # clear of the game pods' 120s graceful-stop window so a slow but healthy
    # world-save is never cut short.
    strandedDwellMinutes: 15
  sampling:
    # How often each running server's player count and restart counter are
    # recorded. Minutes, not seconds: the rows are integrated into playtime and
    # differenced into crash frequency, and neither sharpens by polling harder.
    intervalMinutes: 5
  # Proactive watchdog: on (detect + respond with a Gary turn), shadow (detect
  # and record incident events only — the false-positive tuning mode), or off.
  # Held at shadow until the recorded incidents look trustworthy; flipping to
  # on is a deliberate one-line change.
  watchdog: shadow
  # Per-game catalog path baked into the image; override only if relocated.
  catalogDir: ""
  resources:
    # Sole control plane (Gary, DB/Valkey, backups) with the highest OOM blast radius.
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
