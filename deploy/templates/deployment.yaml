{{- if .Values.bot.enabled -}}
# The Discord bot + ops-agent workload. Runs as the discord-bot ServiceAccount
# (cluster/guardrails/bot-rbac.yaml), which can create/delete gameservers,
# their NodePort Services and PVCs, and read pod IPs to reach the in-pod
# supervisor control API — never patch or exec. The bot token is mounted from
# the ESO-synced discord-bot Secret; everything else is plain config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grizzly-gameservers-bot
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grizzly-gameservers
    app.kubernetes.io/component: bot
spec:
  replicas: {{ .Values.bot.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grizzly-gameservers
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grizzly-gameservers
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: discord-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          {{- if .Values.image.digest }}
          # Gate-signed, digest-pinned image (CI path). Immutable — what cosign
          # signs and Kyverno verifies at admission. pullPolicy is irrelevant for
          # a digest ref but IfNotPresent avoids a needless re-pull.
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          {{- else }}
          # Dev path: mutable hand-pushed tag (just bot-push). Always re-pull.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot
                  key: bot_token
            - name: GAMESERVERS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: GAMESERVERS_DOMAIN
              value: {{ .Values.bot.domain | quote }}
            # Cross-guild operator seed: user ids that are admins in every guild.
            # Per-guild admins are configured at runtime via /config (Postgres);
            # there is no per-guild admin *role* env any more.
            - name: GAMESERVERS_ADMIN_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: discord-bot
                  key: admin_user_ids
            # Guilds the operator has admitted. A Secret rather than a value
            # because guild ids are Discord identifiers, which stay out of git for
            # the same reason the operator ids do. Optional, and an absent or
            # empty list serves every guild — the posture before the allowlist
            # existed — so a sync failure can't lock out the guilds already using
            # the bot. Populate it to make "onboarding is gated" true in code.
            - name: GAMESERVERS_GUILD_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: discord-bot
                  key: guild_allowlist
                  optional: true
            # Ops agent (Gary). The key is synced from 1Password into the ollama-api
            # Secret; marked optional so a missing key leaves Gary disabled (the
            # binary's documented behaviour) rather than crash-looping the pod.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ollama-api
                  key: api_key
                  optional: true
            - name: OLLAMA_MODEL
              value: {{ .Values.bot.ollamaModel | quote }}
            {{- if .Values.bot.ollamaBaseUrl }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.bot.ollamaBaseUrl | quote }}
            {{- end }}
            {{- if .Values.bot.catalogDir }}
            - name: GAMESERVERS_CATALOG_DIR
              value: {{ .Values.bot.catalogDir | quote }}
            {{- end }}
            # Foundation-Postgres connection for the bot's durable state (the
            # no-mention home-channel registry). Host/port/name/user are plain
            # config; only the password is a secret. It's marked optional so a
            # missing secret leaves persistence disabled (the binary degrades —
            # mentions and slash commands still work) rather than crash-looping.
            - name: DB_HOST
              value: {{ .Values.bot.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.bot.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.bot.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.bot.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-db
                  key: db_password
                  optional: true
            # Foundation kv-cache (Valkey) for Gary's deferred-task queue
            # (run_when). Host/port/db are plain config; only the password is a
            # secret, marked optional so a missing secret disables the queue (Gary
            # reports he can't schedule) rather than crash-looping — same shape as
            # DB/S3/Ollama above.
            - name: REDIS_HOST
              value: {{ .Values.bot.kv.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.bot.kv.port | quote }}
            - name: REDIS_DB
              value: {{ .Values.bot.kv.db | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-kv-cache
                  key: redis_password
                  optional: true
            # S3 (s3-bulk versitygw) for world backups/archives. Endpoint/bucket/
            # region are plain config; only the keys are secret, marked optional so
            # a missing secret leaves the backup feature disabled (graceful) rather
            # than crash-looping — same shape as DB/Ollama above.
            - name: GAMESERVERS_S3_ENDPOINT
              value: {{ .Values.bot.s3.endpoint | quote }}
            - name: GAMESERVERS_S3_BUCKET
              value: {{ .Values.bot.s3.bucket | quote }}
            - name: GAMESERVERS_S3_REGION
              value: {{ .Values.bot.s3.region | quote }}
            - name: GAMESERVERS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-s3
                  key: s3_access_key
                  optional: true
            - name: GAMESERVERS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-s3
                  key: s3_secret_key
                  optional: true
            - name: GAMESERVERS_BACKUP_INTERVAL_HOURS
              value: {{ .Values.bot.backup.intervalHours | quote }}
            - name: GAMESERVERS_BACKUP_RETENTION
              value: {{ .Values.bot.backup.retention | quote }}
            - name: GAMESERVERS_RECONCILE_INTERVAL_MINUTES
              value: {{ .Values.bot.reconcile.intervalMinutes | quote }}
            - name: GAMESERVERS_STRANDED_DWELL_MINUTES
              value: {{ .Values.bot.reconcile.strandedDwellMinutes | quote }}
            # Occupancy sampling: one row per running server per tick, on the
            # same Postgres the event log uses. No credential of its own — an
            # absent DB_PASSWORD disables the sampler along with the event log.
            - name: GAMESERVERS_SAMPLE_INTERVAL_MINUTES
              value: {{ .Values.bot.sampling.intervalMinutes | quote }}
            # Proactive watchdog mode (on/shadow/off); detection rides the
            # sampler, so no database also means no watchdog.
            - name: GAMESERVERS_WATCHDOG
              value: {{ .Values.bot.watchdog | quote }}
            # In-game agent endpoint: game-pod supervisors POST player `@Gary`
            # chat triggers here (the reverse loop). The token authenticates
            # those POSTs; it's the same grizzly-gameservers-ingame Secret the
            # game pods read (both live in this namespace), and optional so a
            # missing token runs the endpoint open (NetworkPolicy-protected) —
            # same graceful shape as DB/Ollama/S3.
            - name: GAMESERVERS_INGAME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-ingame
                  key: ingame_token
                  optional: true
            # Presented on every call the bot makes to a game pod's supervisor
            # control API. The same grizzly-gameservers-control Secret the game
            # pods require on the way in; optional so an unprovisioned token
            # leaves both sides on the NetworkPolicy-only posture rather than
            # failing every lifecycle action.
            - name: SUPERVISOR_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-control
                  key: control_token
                  optional: true
            # Operator harness (/operator/*): the authenticated surface a coding
            # agent drives this bot through from a dev box, over a port-forward
            # to the ClusterIP Service. A *different* token from the in-game one
            # above, because that one is mounted into every game pod while this
            # one reaches Gary's full admin surface. Optional, but absent means
            # the routes don't mount at all rather than running open.
            - name: GAMESERVERS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-operator
                  key: operator_token
                  optional: true
            # Turn telemetry: every model-driven Gary turn exports to the
            # platform's Langfuse (grizzly-platform ADR-064) as a trace. Host is
            # plain config; only the key pair is secret, marked optional so a
            # missing secret leaves telemetry off (one log line, everything else
            # intact) rather than crash-looping — same shape as DB/Ollama/S3.
            # Reached in-cluster, which needs cluster/guardrails/
            # bot-to-langfuse-egress.yaml — without it the traffic is silently
            # dropped by the namespace egress leash.
            - name: LANGFUSE_HOST
              value: {{ .Values.bot.langfuse.host | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-langfuse
                  key: langfuse_public_key
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grizzly-gameservers-langfuse
                  key: langfuse_secret_key
                  optional: true
            # Which build this is, stamped on every trace. Kubernetes gives a
            # container no way to read its own image field, so the digest CI
            # already pins into values.yaml is passed in explicitly. Content
            # addressing makes this the prompt version too, since prompt-lib
            # compiles every model-visible string into the binary.
            - name: GAMESERVERS_RELEASE
              value: {{ .Values.image.digest | default .Values.image.tag | quote }}
            - name: RUST_LOG
              value: {{ .Values.bot.logLevel | quote }}
          ports:
            # The in-game agent endpoint the ClusterIP agent Service targets.
            - name: agent
              containerPort: 9360
              protocol: TCP
          # Both probes hit the always-on `GET /health` on the agent port — served
          # whether or not Gary (and thus the trigger route) is configured, so the
          # probes never fail-closed on a Gary-less deploy. Readiness gates the
          # Service/rollout; liveness recovers a wedged process (the bot's real work
          # is outbound to Discord, so a hung gateway won't surface here — but a
          # deadlocked process stops answering and gets restarted).
          # Startup is gated separately from liveness because the bot opens its
          # Postgres pools before it binds /health, and sqlx retries a refused
          # connection until its own 30s deadline — so an unreachable database
          # delays the listener by minutes. Under the liveness probe alone that
          # reads as a wedged process and CrashLoopBackOffs the bot, turning
          # "degrades gracefully without Postgres" into an outage. A startup
          # probe gives the boot up to 5 minutes; liveness only arms after it
          # passes, so a genuine deadlock is still caught just as fast.
          startupProbe:
            httpGet:
              path: /health
              port: agent
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: agent
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: agent
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on; give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end -}}
