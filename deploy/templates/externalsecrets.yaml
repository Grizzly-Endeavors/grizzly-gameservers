{{- if .Values.externalSecrets.enabled -}}
# Pulls the bot/agent credentials from 1Password into namespace-local K8s
# Secrets, through the `onepassword` ClusterSecretStore (vault grizzly-platform).
# A remoteRef key is `<item>/<field>` — the field is part of the key, not a
# separate `property`. Items are named `<domain>-<name>`: `gameservers-*` for this
# app's own material, `stores-*` for foundation-store grants.
#
# refreshPolicy is OnChange because 1Password meters requests per account per day
# across every service account. Editing a value in 1Password alone therefore never
# reaches the cluster — change the ExternalSecret in git, or force a sync with
# `kubectl annotate externalsecret <name> force-sync=$(date +%s)`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-bot
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: discord-bot
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: gameservers-discord/bot_token
    # The operator allowlist lives in OpenBao rather than git: the repo is
    # public, and while these are not credentials they tie a personal Discord
    # identity to the project, so we keep them out of version control. The bot is
    # multi-guild now (commands register per-guild on join), so no guild id is
    # pinned here.
    - secretKey: admin_user_ids
      remoteRef:
        key: gameservers-discord/admin_user_ids
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: ollama-api
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: gameservers-ollama/api_key
---
# The bot's foundation-Postgres password (durable home-channel state). Lives
# under stores/ (a foundation-store grant), provisioned by grizzly-platform's
# setup-grizzly-gameservers-stores.yml. Only the password is secret; host/port/
# db/user are plain config in the Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-db
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: stores-grizzly-gameservers/db_password
---
# The shared kv-cache (Valkey) password for Gary's deferred-task queue. The
# instance is a shared foundation store with one `requirepass` password (no ACL
# users), so this is the platform-shared credential under stores/kv-cache — not a
# per-app grant. Only the password is secret; host/port/db are plain config in the
# Deployment. Absent password leaves the deferred-task feature disabled (graceful).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-kv-cache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-kv-cache
    creationPolicy: Owner
  data:
    - secretKey: redis_password
      remoteRef:
        key: stores-kv-cache/password
---
# The bot's s3-bulk versitygw keys for world backups/archives. Also a foundation-
# store grant under stores/, provisioned by setup-grizzly-gameservers-stores.yml
# (--tags s3). Only the keys are secret; endpoint/bucket/region are plain config
# in the Deployment. Absent keys leave the backup feature disabled (graceful).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-s3
    creationPolicy: Owner
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: stores-grizzly-gameservers/s3_access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: stores-grizzly-gameservers/s3_secret_key
---
# Shared bearer token for the in-game agent endpoint (the reverse loop). One
# Secret serves both callers, which share this namespace: the bot reads it to
# verify incoming triggers, and the game pods (games/*/gameserver.yaml) read the
# same key as SUPERVISOR_AGENT_TOKEN to authenticate their POSTs. Until the token
# is provisioned in OpenBao the Secret is empty and both sides degrade to the
# unauthenticated, NetworkPolicy-only posture (see docs/decisions). Generate with
# `openssl rand -hex 32` and store at grizzly-platform/gameservers/ingame → token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-ingame
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-ingame
    creationPolicy: Owner
  data:
    - secretKey: ingame_token
      remoteRef:
        key: gameservers-ingame/token
---
# Shared bearer token for the supervisor control API, in the opposite direction to
# grizzly-gameservers-ingame: the bot presents it when it dials a game pod's
# control port, and every game pod requires it on the way in. One Secret serves
# both halves, which share this namespace.
#
# This is defence in depth, not the primary control. The game-servers egress leash
# already opens exactly one path to that port (bot identity → game pods), so this
# closes the case where something inside the namespace acquires that identity and
# would otherwise inherit full lifecycle and filesystem access to every game pod.
#
# Until the token is provisioned in OpenBao the Secret is empty and both sides
# degrade to the NetworkPolicy-only posture — deliberately, so a half-rolled
# deploy can't lock the bot out of every server at once. Both sides read an empty
# value as "no token", so the two never disagree about whether auth is on.
# Generate with `openssl rand -hex 32` and store at
# grizzly-platform/gameservers/control → token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-control
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-control
    creationPolicy: Owner
  data:
    - secretKey: control_token
      remoteRef:
        key: gameservers-control/token
---
# Bearer token for the operator harness routes on the agent endpoint
# (/operator/*) — the authenticated surface a coding agent drives the deployed
# bot through over `kubectl port-forward svc/grizzly-gameservers-agent`.
# Deliberately a *separate* secret from grizzly-gameservers-ingame: that token is
# mounted into every game pod in this namespace, whereas this one reaches Gary's
# full admin tool surface and can pre-approve destructive actions, so only the
# bot may read it. Absent means the routes are never mounted — fail-closed,
# unlike the in-game endpoint's open degradation. Generate with
# `openssl rand -hex 32` and store at grizzly-platform/gameservers/operator →
# token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-operator
    creationPolicy: Owner
  data:
    - secretKey: operator_token
      remoteRef:
        key: gameservers-operator/token
---
# The bot's Langfuse project keys, for turn telemetry. Only the key pair is
# secret; the ingestion host is plain config in the Deployment. Absent keys leave
# telemetry disabled (one log line at startup) and change nothing else, so this
# is safe to be missing. Minted in the Langfuse UI per project — rotating means
# minting a new pair there and updating the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grizzly-gameservers-langfuse
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: grizzly-gameservers
spec:
  refreshPolicy: {{ .Values.externalSecrets.refreshPolicy }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: grizzly-gameservers-langfuse
    creationPolicy: Owner
  data:
    - secretKey: langfuse_public_key
      remoteRef:
        key: gameservers-langfuse/public_key
    - secretKey: langfuse_secret_key
      remoteRef:
        key: gameservers-langfuse/secret_key
{{- end -}}
